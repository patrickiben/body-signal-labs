<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101525">
<title>Endless Cockpit</title>
<meta name="description" content="Eight procedural cycling routes: coast, tropical preserve, meadows, New England Autumn, canyon, Rainbow orbit, Misty pines and Snake Way above golden clouds, moving at your cadence.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101525'/%3E%3Cpath d='M5 17h6l2.5-6 4 11 2.5-5H27' fill='none' stroke='%23b8b7ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --bg: #101525;
  --ink: #eeedfb;
  --muted: #b6b9cf;
  --faint: #8d93ad;
  --accent: #b8b7ff;
  --line: rgba(191, 194, 236, 0.17);
  --glass: rgba(24, 28, 46, 0.72);
  --sheet: #1a2032;
  --soft: rgba(184, 183, 255, 0.1);
  --shadow: rgba(2, 6, 19, 0.45);
  --good: #bfe8a6;
  --warn: #f1cf8e;
  --bad: #f4a3a3;
  --demo: #e6c7a3;
  --serif: Georgia, "Times New Roman", serif;
  --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 400; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; }
button, a, input, select { touch-action: manipulation; }
button { color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
a { color: var(--accent); }
[hidden] { display: none !important; }

.scene { position: relative; height: 100svh; min-height: 320px; isolation: isolate; overflow: hidden; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; touch-action: none; }
.vignette { position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(180deg, rgba(5, 8, 18, 0.5) 0%, transparent 18%, transparent 58%, rgba(5, 8, 18, 0.72) 100%); }
.chrome { transition: opacity 0.7s ease; }
body.quiet .chrome { opacity: 0; }
body.quiet .chrome:focus-within { opacity: 1; }
body.quiet .chip { display: none; }

.header { position: absolute; left: max(42px, env(safe-area-inset-left)); right: max(42px, env(safe-area-inset-right)); top: max(28px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; gap: 20px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 16px; letter-spacing: -0.35px; color: var(--ink); text-shadow: 0 1px 14px rgba(0, 0, 0, 0.6); text-decoration: none; }
.brand svg { width: 24px; height: 28px; stroke: var(--accent); fill: none; stroke-width: 1.15; }
.brand span { font-weight: 500; }
.top-actions { display: flex; align-items: center; gap: 10px; }
.top-action { border: 1px solid var(--line); border-radius: 999px; padding: 10px 15px; color: var(--ink); font-size: 12px; background: var(--glass); backdrop-filter: blur(12px); transition: background 0.25s; }
.top-action:hover { background: var(--soft); }
.top-action.icon { padding: 9px; display: grid; place-items: center; }
.top-action.icon svg { width: 16px; height: 16px; }
.mode-switch { position: absolute; top: max(25px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; padding: 4px; border: 1px solid var(--line); border-radius: 30px; background: var(--glass); backdrop-filter: blur(12px); }
.mode-switch button { padding: 10px 27px; min-height: 38px; border-radius: 25px; font-size: 13px; color: var(--muted); transition: background 0.35s, color 0.35s; }
.mode-switch button[aria-pressed="true"] { background: var(--soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

.intro { position: absolute; top: 17%; left: 20px; right: 20px; text-align: center; pointer-events: none; transition: opacity 0.9s ease, transform 0.9s ease; text-shadow: 0 1px 3px rgba(4, 6, 16, 0.55), 0 2px 26px rgba(4, 6, 16, 0.85); }
.intro::before { content: ""; position: absolute; left: 50%; top: 50%; width: min(1100px, 130%); height: 340px; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(8, 10, 22, 0.52), rgba(8, 10, 22, 0.28) 45%, transparent 72%); z-index: -1; }
body.playing .intro { opacity: 0; transform: translateY(-10px); }
.eyebrow { font-size: 10px; letter-spacing: 3.3px; color: var(--ink); text-transform: uppercase; margin: 0 0 17px; }
.intro h1 { font-family: var(--serif); font-size: clamp(34px, 4.3vw, 62px); font-weight: 400; letter-spacing: -1.4px; line-height: 1.15; margin: 0; }
.intro p:last-child { color: var(--ink); font-size: 13px; letter-spacing: 0.05px; margin: 15px 0 0; }

.dock-wrap { position: absolute; bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px)); left: 12px; right: 12px; display: flex; align-items: center; flex-direction: column; gap: 12px; }
#hud { display: flex; align-items: flex-end; justify-content: center; gap: clamp(18px, 4vw, 56px); text-shadow: 0 1px 16px rgba(4, 6, 16, 0.85); }
.gauge { text-align: center; min-width: 74px; }
.gauge .k { display: block; font-size: 9px; letter-spacing: 2.4px; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
.gauge .v { font-size: 22px; font-weight: 300; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; }
.gauge .v small { font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: 0.2px; margin-left: 3px; }
.gauge.hero .v { font-size: clamp(44px, 5vw, 66px); font-weight: 200; letter-spacing: -2px; line-height: 1; }
.gauge.hero .v small { display: none; }

#hit-strip { display: flex; gap: 12px; align-items: center; justify-content: center; }
.hitdot { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 9px; letter-spacing: 1.4px; color: var(--muted); }
.hitdot i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); opacity: 0.16; box-shadow: 0 0 calc(var(--l, 0) * 18px) var(--accent); }

.badges { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; align-items: center; }
.source-badge, .chip { display: inline-flex; gap: 8px; align-items: center; font-size: 11px; color: var(--ink); border: 1px solid var(--line); border-radius: 20px; background: rgba(20, 24, 40, 0.68); padding: 8px 12px; backdrop-filter: blur(8px); }
.chip { color: var(--muted); max-width: 46vw; }
.chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
.source-badge[data-source="live"] .dot, .chip[data-tone="good"] .dot { background: var(--good); box-shadow: 0 0 12px #bfe8a688; }
.source-badge[data-source="demo"] { border-color: #e6c7a366; background: rgba(66, 48, 28, 0.72); }
.source-badge[data-source="demo"] .dot { background: var(--demo); box-shadow: 0 0 10px #e6c7a388; }
.source-badge[data-source="replay"] .dot { background: #a8c6f4; }
.source-badge[data-source="open"] .dot, .chip[data-tone="warn"] .dot { background: var(--warn); }
.chip[data-tone="bad"] .dot { background: var(--bad); }
.chip[data-tone="wait"] .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.chip[data-tone="bad"] { color: #ffdcdc; border-color: rgba(244, 163, 163, 0.35); }
.chip[data-tone="good"] { color: var(--ink); }
.source-badge.keep { transition: none; }
body.quiet .keep-visible { opacity: 0.85; }
@keyframes pulse { 50% { opacity: 0.3; } }

.dock { display: flex; align-items: center; padding: 7px 9px; border: 1px solid var(--line); background: var(--glass); border-radius: 24px; box-shadow: 0 16px 60px var(--shadow); backdrop-filter: blur(24px); gap: 4px; }
.dock button { display: flex; align-items: center; flex-direction: column; gap: 7px; padding: 11px 19px 10px; border-radius: 17px; min-width: 74px; transition: background 0.2s; }
.dock button:hover, .dock button[aria-expanded="true"] { background: var(--soft); }
.dock button span { font-size: 10px; letter-spacing: 0.2px; color: var(--muted); }
.dock button.connected svg { color: var(--accent); }
.dock button.rec svg { color: var(--bad); }
.dock-divider { height: 30px; width: 1px; background: var(--line); margin: 0 5px; }
.truth { font-size: 10px; letter-spacing: 0.3px; color: var(--muted); text-align: center; margin: 0; max-width: 680px; line-height: 1.5; text-shadow: 0 1px 10px rgba(4, 6, 16, 0.9); }

.sheet:focus { outline: none; }
.sheet { color: var(--ink); background: var(--sheet); border: 1px solid var(--line); border-radius: 28px; padding: 30px; width: calc(100% - 32px); max-width: 480px; max-height: min(86svh, 780px); overflow-y: auto; box-shadow: 0 25px 100px #0005; }
.sheet.wide { max-width: 780px; }
.sheet::backdrop { background: #060c1690; backdrop-filter: blur(9px); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; gap: 16px; }
.sheet h2 { font-family: var(--serif); font-size: 30px; letter-spacing: -0.5px; font-weight: 400; margin: 0; }
.close { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); background: var(--soft); flex: none; }
.close svg { width: 17px; height: 17px; }
.sheet-intro { color: var(--muted); font-size: 13px; line-height: 1.65; margin: 12px 0 22px; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 9px 15px; font-size: 12px; background: var(--soft); color: var(--ink); white-space: nowrap; transition: background 0.2s, border-color 0.2s; }
.pill:hover:not(:disabled) { border-color: var(--accent); }
.pill.primary { background: var(--accent); color: #141627; border-color: transparent; font-weight: 500; }
.pill.wide { width: 100%; padding: 12px 15px; font-size: 13px; }
.pill.on { background: var(--accent); color: #141627; }
.device-card { display: flex; align-items: flex-start; gap: 14px; padding: 16px 0 12px; border-top: 1px solid var(--line); margin-top: 14px; }
.device-card svg.ic { width: 26px; height: 26px; fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; flex: none; margin-top: 2px; }
.device-info { flex: 1; min-width: 0; }
.device-info strong { font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.device-info strong .dot { display: inline-block; }
.device-info[data-tone="good"] strong .dot { background: var(--good); box-shadow: 0 0 10px #bfe8a688; }
.device-info[data-tone="warn"] strong .dot { background: var(--warn); }
.device-info[data-tone="bad"] strong .dot { background: var(--bad); }
.device-info[data-tone="wait"] strong .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.device-info .state { font-size: 12px; color: var(--ink); margin: 5px 0 0; font-weight: 500; }
.device-info .why { font-size: 12px; color: var(--muted); margin: 3px 0 0; line-height: 1.5; }
.controls-grid { display: grid; gap: 11px; padding: 0 0 8px 40px; }
.field { display: grid; gap: 5px; font-size: 11px; color: var(--muted); letter-spacing: 0.15px; }
.field .row { display: flex; justify-content: space-between; gap: 10px; }
.field b { font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; }
select { background: #111627; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; width: 100%; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) calc(var(--val, 50) * 1%), var(--line) calc(var(--val, 50) * 1%)); }
input[type="range"]::-moz-range-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) calc(var(--val, 50) * 1%), var(--line) calc(var(--val, 50) * 1%)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); margin-top: -5.5px; box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.25); }
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--ink); }
.meter { display: grid; gap: 3px; }
.meter div { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--good), var(--good) 70%, var(--warn) 88%, var(--bad)); }
pre.monitor { font-family: var(--mono); font-size: 11px; line-height: 1.55; color: var(--muted); background: #111627; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin: 0; min-height: 74px; white-space: pre-wrap; overflow: hidden; }
details { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
summary { font-size: 13px; cursor: pointer; color: var(--ink); padding: 3px 0; }
details > div, details > ol, details > p { font-size: 12px; color: var(--muted); line-height: 1.6; }
details ol { padding-left: 18px; margin: 10px 0 2px; }
details li { margin-bottom: 7px; }
.check { display: flex; gap: 9px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 14px; }
.padrow { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; align-items: center; padding: 5px 0; font-size: 12px; }
.padrow code { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.padrow .pill { padding: 5px 11px; font-size: 11px; }

.sig-canvas { width: 100%; display: block; border-radius: 12px; background: #0b0f1c; border: 1px solid var(--line); }
.sig-title { display: flex; justify-content: space-between; gap: 12px; font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); margin: 16px 0 7px; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 9px; margin-top: 14px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: rgba(184, 183, 255, 0.04); }
.stat .k { display: block; font-size: 9px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
.stat .v { font-size: 17px; font-weight: 300; font-variant-numeric: tabular-nums; }
.stat .n { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; }
table.maptable { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0 4px; }
table.maptable th, table.maptable td { text-align: left; padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--muted); font-weight: 400; }
table.maptable th { color: var(--ink); font-weight: 500; white-space: nowrap; }
.tag { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 10px 0; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
#toast { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); padding: 9px 15px; border-radius: 999px; font-size: 12px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); opacity: 0; pointer-events: none; transition: opacity 0.3s; max-width: 90vw; text-align: center; z-index: 5; }
#toast.show { opacity: 1; }
#gl-error { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); max-width: 460px; width: calc(100% - 40px); text-align: center; font-size: 14px; line-height: 1.6; color: var(--ink); background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 18px 22px; }

@media (max-width: 860px) {
  .header { left: 18px; right: 18px; top: max(14px, env(safe-area-inset-top)); }
  .mode-switch { top: max(62px, calc(env(safe-area-inset-top) + 48px)); }
  .mode-switch button { padding: 8px 24px; font-size: 12px; min-height: 34px; }
  .intro { top: 22%; }
  .eyebrow { font-size: 9px; letter-spacing: 2.6px; margin-bottom: 13px; }
  .intro h1 { font-size: 34px; letter-spacing: -1px; }
  .intro p:last-child { font-size: 12px; max-width: 280px; margin: 12px auto 0; line-height: 1.6; }
  .dock { padding: 5px; gap: 0; border-radius: 22px; }
  .dock button { padding: 10px 11px 9px; min-width: 62px; gap: 6px; }
  .dock button svg { width: 19px; height: 19px; }
  .dock-divider { margin: 0 2px; }
  .source-badge, .chip { font-size: 10px; padding: 7px 10px; }
  .truth { font-size: 10px; }
  #hud { gap: 12px; }
  .gauge { min-width: 62px; }
  .gauge .v { font-size: 18px; }
  .gauge.hero .v { font-size: 44px; }
  .sheet { padding: 24px; position: fixed; margin: auto auto 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; width: 100%; max-width: 560px; max-height: 88svh; padding-bottom: calc(26px + env(safe-area-inset-bottom)); }
  .sheet.wide { max-width: 100%; }
  .sheet h2 { font-size: 27px; }
  .controls-grid { padding-left: 0; }
}
@media (max-height: 640px) {
  .intro { display: none; }
  .truth { display: none; }
  #hit-strip { display: none; }
}
/* the narrowest phones: the brand gives way so the header's buttons stay on screen */
@media (max-width: 380px) {
  .header { gap: 10px; }
  .brand { gap: 8px; font-size: 14px; min-width: 0; }
  .brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top-action { padding: 9px 12px; }
}
/* phones held sideways and other short screens: everything on one screen, nothing pushed below the edge */
@media (max-height: 520px) {
  .header { top: max(8px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); }
  .top-action { padding: 7px 12px; }
  .top-action.icon { padding: 7px; }
  .mode-switch { top: max(8px, env(safe-area-inset-top)); }
  .mode-switch button { padding: 6px 16px; min-height: 30px; }
  .dock-wrap { bottom: max(6px, env(safe-area-inset-bottom)); gap: 5px; }
  #hud { gap: 14px; }
  .gauge { min-width: 54px; }
  .gauge .k { font-size: 8px; letter-spacing: 1.8px; margin-bottom: 2px; }
  .gauge .v { font-size: 15px; }
  .gauge.hero .v { font-size: 30px; }
  .dock { padding: 3px; border-radius: 18px; }
  .dock button { padding: 5px 10px 4px; gap: 2px; min-width: 52px; }
  .dock button svg { width: 16px; height: 16px; }
  .dock button span { font-size: 9px; }
  .dock-divider { height: 22px; }
  .source-badge, .chip { padding: 5px 9px; font-size: 10px; }
  #pedal { min-height: 30px; padding-top: 5px; padding-bottom: 5px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
}

/* the same-tab link among the three pages of the suite */
.family { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 4px; font-size: 10px; letter-spacing: 0.3px; }
.family a { color: var(--muted); text-decoration: none; padding: 7px 8px; border-radius: 12px; text-shadow: 0 1px 10px rgba(4, 6, 16, 0.9); transition: color 0.2s; }
.family a:hover { color: var(--ink); }
.family a[aria-current="page"] { color: var(--ink); }
@media (max-height: 640px) { .family { display: none; } }

/* Endless Cockpit: the scenery on the main screen */
.scenebar { position: absolute; top: max(92px, calc(env(safe-area-inset-top) + 66px)); left: 50%; transform: translateX(-50%); width: min(900px, calc(100% - 24px)); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.scene-tiles { display: flex; gap: 10px; justify-content: center; max-width: 100%; padding: 3px; }
/* each tile is the scene itself, with its name on a dark fade so it reads over any sky */
.scene-tile { flex: none; position: relative; display: block; padding: 0; border-radius: 13px; transition: transform 0.25s; }
.scene-tile canvas { display: block; width: 100px; height: 60px; border-radius: 13px; border: 1px solid var(--line); box-shadow: 0 10px 30px var(--shadow); transition: border-color 0.25s, box-shadow 0.25s; }
.scene-tile::after { content: ""; position: absolute; left: 1px; right: 1px; bottom: 1px; height: 58%; border-radius: 0 0 12px 12px; background: linear-gradient(transparent, rgba(6, 8, 18, 0.78)); pointer-events: none; }
.scene-tile span { position: absolute; left: 9px; right: 6px; bottom: 6px; z-index: 1; text-align: left; font-size: 11px; letter-spacing: 0.2px; color: rgba(238, 237, 251, 0.82); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (hover: hover) { .scene-tile:hover { transform: translateY(-2px); } }
.scene-tile[aria-pressed="true"] canvas { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 22px color-mix(in srgb, var(--accent) 35%, transparent), 0 10px 30px var(--shadow); }
.scene-tile[aria-pressed="true"] span { color: #fff; font-weight: 500; }
.scene-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; max-width: 100%; }
.seg { display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 22px; background: var(--glass); backdrop-filter: blur(12px); }
.seg button, .seg-solo { padding: 7px 13px; min-height: 32px; border-radius: 18px; font-size: 12px; color: var(--muted); white-space: nowrap; transition: background 0.3s, color 0.3s; }
.seg button:hover, .seg-solo:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.seg-solo { border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(12px); }
.seg-solo[aria-pressed]::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 8px; border-radius: 50%; background: var(--faint); vertical-align: 1px; }
.seg-solo[aria-pressed="true"] { color: var(--ink); }
.seg-solo[aria-pressed="true"]::before { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
body[data-app="endless-cockpit"] .intro { top: 37%; }
#pedal { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }

.scene-row .short { display: none; }

/* upright phones and narrow windows: all eight scenes in two rows that fit, names under the pictures,
   and the options on two rows. Nothing scrolls sideways and nothing is cut off. */
@media (max-width: 860px) {
  .scenebar { top: max(62px, calc(env(safe-area-inset-top) + 50px)); width: 100%; gap: 8px; padding: 0 12px; }
  .scene-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: 100%; max-width: 660px; padding: 0; }
  .scene-tile { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
  .scene-tile canvas { width: 100%; height: auto; aspect-ratio: 336 / 196; border-radius: 10px; box-shadow: none; }
  .scene-tile[aria-pressed="true"] canvas { box-shadow: 0 0 0 1px var(--accent); }
  .scene-tile::after { display: none; }
  .scene-tile span { position: static; width: 100%; font-size: 9.5px; line-height: 1.25; text-align: center; white-space: normal; color: rgba(238, 237, 251, 0.82); text-shadow: 0 1px 3px rgba(4, 6, 16, 0.9), 0 1px 10px rgba(4, 6, 16, 0.95); }
  .scene-tile[aria-pressed="true"] span { color: var(--ink); }
  .scene-row { gap: 6px; width: 100%; }
  .seg, .seg-solo { flex: none; }
  .seg button, .seg-solo { padding: 6px 10px; min-height: 32px; font-size: 11px; }
  .scene-row .long { display: none; }
  .scene-row .short { display: inline; }
  .scene-row > .seg:first-child { order: 1; }
  #new-route { order: 2; }
  .scene-row > .seg:nth-child(2) { order: 3; }
  #auto-scene { order: 4; }
  body[data-app="endless-cockpit"] .intro .eyebrow { display: none; }
  body[data-app="endless-cockpit"] .intro { top: 46%; }
}
/* a shorter upright phone: the scenery and the ride before the welcome text */
@media (max-width: 860px) and (max-height: 900px) {
  body[data-app="endless-cockpit"] .intro { display: none; }
}
/* phones held sideways, and other short screens: one slim row of scenes with names on the pictures */
@media (max-height: 520px) {
  .scenebar { top: max(50px, calc(env(safe-area-inset-top) + 42px)); gap: 6px; }
  .scene-tiles { display: flex; justify-content: center; width: auto; max-width: none; gap: 6px; }
  .scene-tile { display: block; position: relative; }
  .scene-tile canvas { width: clamp(46px, calc((100vw - 78px) / 8), 96px); height: auto; aspect-ratio: 96 / 52; border-radius: 9px; }
  .scene-tile::after { display: block; border-radius: 0 0 8px 8px; }
  .scene-tile span { position: absolute; left: 7px; right: 4px; bottom: 4px; width: auto; font-size: 9px; text-align: left; white-space: nowrap; color: rgba(238, 237, 251, 0.85); }
  .seg button, .seg-solo { padding: 5px 10px; min-height: 30px; font-size: 11px; }
}

.route-caption { margin: 0; color: var(--ink); font-size: 11px; line-height: 1.4; text-align: center; text-shadow: 0 1px 5px #101820; padding: 4px 12px; border-radius: 12px; background: rgba(12,22,25,.62); backdrop-filter: blur(8px); }
@media (max-width: 860px) { .route-caption { max-width: 95%; font-size: 10px; padding: 3px 9px; } }
@media (max-height: 520px) { .route-caption { display: none; } }
/* Compact landscape phones need the options on one row above the ride readouts. */
@media (min-width: 480px) and (max-height: 360px) {
  .scene-row { gap: 4px; }
  .seg { padding: 2px; }
  .seg button, .seg-solo { padding: 4px 7px; min-height: 28px; font-size: 10px; }
}

body[data-app="endless-cockpit"] #hud { isolation: isolate; }
body[data-app="endless-cockpit"] #hud::before { content: ""; position: absolute; inset: -8px -10px; z-index: -1; pointer-events: none; border-radius: 14px; background: rgba(7,13,23,.65); }

<script>
/* chrome.js: the page frame shared by the cockpits. The markup and classes are the ones shell.css styles.
   A page brings its own stage, readouts, source badges and sheets. */
(function (global) {
  'use strict';

  const ICON = {
    connect: '<path d="M8 8v8M16 8v8M5 11v2M19 11v2M12 4v16"/>',
    session: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
    signal: '<path d="M3 12h3l2-6 4 13 3-9 2 4h4"/>',
    about: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
    route: '<path d="M6 21c0-5 4-5 6-9s2-6 1-9"/><path d="M18 21c0-4-2-5-3-8"/>',
    full: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
    close: '<path d="m6 6 12 12M18 6 6 18"/>',
    play: '<path d="M7 5v14l11-7z"/>',
    heart: '<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/><path d="M6.5 12.5h3l1.5-2.5 2 4 1.2-1.5h3.3"/>',
    crank: '<circle cx="7" cy="16" r="3.5"/><circle cx="17" cy="16" r="3.5"/><path d="m7 16 4-7h4l2 7M9 9h4M11 16l4-7"/>',
  };
  const svg = (name, cls) => `<svg viewBox="0 0 24 24" aria-hidden="true"${cls ? ` class="${cls}"` : ''}>${ICON[name]}</svg>`;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const closeBtn = (label) => `<button class="close" data-close aria-label="${label}">${svg('close')}</button>`;

      <dialog class="sheet${s.wide ? ' wide' : ''}" id="${s.id}-sheet" aria-labelledby="${s.id}-title" tabindex="-1">
        <div class="sheet-head"><h2 id="${s.id}-title">${esc(s.title)}</h2>${closeBtn(`Close ${s.label.toLowerCase()}`)}</div>
        ${s.intro ? `<p class="sheet-intro">${esc(s.intro)}</p>` : ''}
        ${s.html}
      </dialog>`;

  function mountChrome(cfg) {
    const scene = $('scene');
    document.body.dataset.app = cfg.id;

    scene.insertAdjacentHTML('beforeend', `
      <div class="vignette"></div>
      <header class="header chrome">
        <a class="brand" href="index.html" aria-label="${esc(cfg.name)}: back to the home page">${cfg.brand}<span>${esc(cfg.name)}</span></a>
        <div class="top-actions">
          <button class="top-action" id="demo-button">Try a demo</button>
          <button class="top-action icon" id="fs-button" aria-label="Full screen">${svg('full')}</button>
        </div>
      </header>
      ${cfg.modes ? `<nav class="mode-switch chrome" aria-label="${esc(cfg.modeLabel)}">${cfg.modes.map((m) => `<button data-mode="${m.id}" aria-pressed="${m.id === cfg.mode}">${esc(m.label)}</button>`).join('')}</nav>` : ''}
      <div class="intro">
        <p class="eyebrow" id="intro-eyebrow"></p>
        <h1 id="intro-title"></h1>
        <p id="intro-sub"></p>
      </div>
      ${cfg.stage || ''}
      <div id="toast" role="status"></div>
      <div id="sr-status" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
      <div class="dock-wrap">
        <div id="hud" class="chrome">${cfg.hud || ''}</div>
        ${cfg.beforeBadges || ''}
        <div class="badges">${cfg.badges}</div>
        <nav class="dock chrome" aria-label="Controls">
          ${cfg.sheets.filter((s) => s.id !== 'about').map((s) => `<button id="${s.id}-button" aria-haspopup="dialog" aria-expanded="false">${svg(s.icon)}<span>${esc(s.label)}</span></button>`).join('')}

          <button id="about-button" aria-haspopup="dialog" aria-expanded="false">${svg('about')}<span>About</span></button>
        </nav>
        <p class="truth chrome" id="truth">${esc(cfg.truth)}</p>

    document.body.insertAdjacentHTML('beforeend', cfg.sheets.map(sheet).join(''));

    /* ---------- sheets ---------- */
    const openSheet = (name) => {
      const d = $(`${name}-sheet`);
      if (!d || d.open) return;
      if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
      d.focus({ preventScroll: true });
      const b = $(`${name}-button`); if (b) b.setAttribute('aria-expanded', 'true');

    /* ---------- modes ---------- */
    let mode = cfg.mode;
    const modeButtons = [...document.querySelectorAll('.mode-switch button')];
    const setMode = (m) => {
      if (!modeButtons.some((b) => b.dataset.mode === m)) return;
      mode = m;
      modeButtons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));

      if (cfg.onMode) cfg.onMode(m);

    if (!cfg.modes) { $('intro-eyebrow').textContent = cfg.intro.eyebrow; $('intro-title').textContent = cfg.intro.title; $('intro-sub').textContent = cfg.intro.subtitle; }

    /* ---------- small tools ---------- */

    document.querySelectorAll('.sheet input[type="range"], #hud input[type="range"]').forEach(syncRange);
    const glFail = (msg) => { const d = document.createElement('div'); d.id = 'gl-error'; d.setAttribute('role', 'alert'); d.textContent = msg; scene.appendChild(d); };
    const download = (blob, name) => { const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); };

    /* ---------- demo, full screen, keys, quiet chrome ---------- */
    $('demo-button').addEventListener('click', () => cfg.toggleDemo());
    const fullscreen = () => { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => toast('Full screen is not available here.')); };
    $('fs-button').addEventListener('click', fullscreen);
    // A mouse click should not leave a button holding the keyboard, or Space would press it again.
    // Keyboard presses report detail 0, so keyboard users keep their focus.
    addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('button'); if (b && e.detail > 0 && !b.closest('dialog')) b.blur(); });
    let hideChrome = false, lastMove = performance.now();
    const wake = () => { lastMove = performance.now(); if (!hideChrome) document.body.classList.remove('quiet'); };
    ['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach((ev) => addEventListener(ev, wake, { passive: true }));
    addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
      if (e.target.closest && e.target.closest('input, select, textarea, dialog[open]')) return;
      const key = e.key.toLowerCase();
      if (key === 'c') openSheet('connect');
      else if (key === 'd') cfg.toggleDemo();
      else if (key === 'f') fullscreen();

    return { toast, openSheet, glFail, setMode, get mode() { return mode; }, syncRange, quietTick, download, svg, esc };
  }

  global.mountChrome = mountChrome;
})(window);

uniform float uSpark,uCoast,uForest,uMeadow,uAlpine,uCanyon,uOrbit,uMisty,uSnake,uWidth;
uniform float uShimmer,uAurora,uHaze,uWeather,uWarm,uBreath,uBreathOn,uNebula;
uniform vec4 uGhost;
uniform vec4 uRouteA; uniform float uRouteB,uRouteC,uRouteD,uRouteE;
float routeX(float z,float turn,float winding){z*=winding;return turn*(14.*sin(z*.0113+1.+uSeed)+6.5*sin(z*.0271+2.2+uSeed*1.7));}
float routeY(float z,float rise,float winding){z*=winding;return rise*(7.*sin(z*.0071+.4+uSeed)+3.4*sin(z*.0193+1.9+uSeed*2.3)+1.1*sin(z*.0471+3.1));}
float pathX(float z){float v=0.;if(uRouteA.x>.000001)v+=uRouteA.x*routeX(z,1.25,.8);if(uRouteA.y>.000001)v+=uRouteA.y*routeX(z,.75,1.15);if(uRouteA.z>.000001)v+=uRouteA.z*routeX(z,.95,.7);if(uRouteA.w>.000001)v+=uRouteA.w*routeX(z,1.4,.65);if(uRouteB>.000001)v+=uRouteB*routeX(z,.75,1.45);if(uRouteC>.000001)v+=uRouteC*routeX(z,2.1,.55);if(uRouteD>.000001)v+=uRouteD*routeX(z,1.,1.);if(uRouteE>.000001)v+=uRouteE*routeX(z,7.,.75);return v;}
float roadY(float z){float v=0.;if(uRouteA.x>.000001)v+=uRouteA.x*routeY(z,.4,.8);if(uRouteA.y>.000001)v+=uRouteA.y*routeY(z,.3,1.15);if(uRouteA.z>.000001)v+=uRouteA.z*routeY(z,.5,.7);if(uRouteA.w>.000001)v+=uRouteA.w*routeY(z,.7,.65);if(uRouteB>.000001)v+=uRouteB*routeY(z,.25,1.45);if(uRouteC>.000001)v+=uRouteC*routeY(z,1.05,.55);if(uRouteD>.000001)v+=uRouteD*routeY(z,1.,1.);if(uRouteE>.000001)v+=uRouteE*routeY(z,.65,.75);return v;}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return textureLod(uN,(i+f+.5)/256.,0.).r;}
const mat2 R=mat2(.8,.6,-.6,.8);
float fbm2(vec2 p){return (vn(p)+.5*vn(R*p*2.03+3.1))/1.5;}
float fbm4(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vn(p);p=R*p*2.03+1.7;a*=.5;}return s/.9375;}
// Static, seeded world-space vegetation and wildlife. No frame-random color or motion.
// Analytic world-pixel footprint: derivatives are undefined inside the row/leaf
// branches, whose neighboring pixels may be evaluating different billboards.
float foliageAA=.006;
float foliageEdge(float d){return 1.-smoothstep(-foliageAA,foliageAA,d);}
// Integrate a finite strip across one projected pixel. Unlike an SDF edge alone,
// this preserves coverage when a stem or leaflet becomes narrower than a pixel.
float foliageBand(float center,float halfWidth,float aa){
  return clamp((center+halfWidth+aa)/(2.*aa),0.,1.)-clamp((center-halfWidth+aa)/(2.*aa),0.,1.);
}
float foliageSpan(float value,float lo,float hi,float aa){return foliageBand(value-(lo+hi)*.5,(hi-lo)*.5,aa);}
void foliagePaint(inout vec3 c,inout float alpha,vec3 pigment,float mask){
  float a=mask+alpha*(1.-mask);
  c=(pigment*mask+c*alpha*(1.-mask))/max(a,.00001);alpha=a;
}
float line2(vec2 p,vec2 a,vec2 b){vec2 q=p-a,v=b-a;return length(q-v*clamp(dot(q,v)/dot(v,v),0.,1.));}
float leaf2(vec2 p,vec2 a,vec2 b,float width){
  vec2 axis=b-a,q=p-a;float t=dot(q,axis)/dot(axis,axis);
  float crossD=abs(q.x*axis.y-q.y*axis.x)/length(axis);
  return foliageBand(crossD,width*sin(3.14159*clamp(t,0.,1.)),foliageAA)*foliageSpan(t*length(axis),0.,length(axis),foliageAA);
}
vec4 tropicalTree(vec2 p,float h,float side){
  vec3 c=vec3(0.);float alpha=0.;
  float H=6.5+h*4.,bend=-side*(.5+h*1.4);
  float yf=clamp(p.y/H,0.,1.),tx=bend*yf*yf;
  float trunk=foliageBand(p.x-tx,.22-.09*yf,foliageAA)*foliageSpan(p.y,0.,H,foliageAA);
  float trunkDetail=1.-smoothstep(.35,1.4,foliageAA*15.);
  if(trunk>.001)foliagePaint(c,alpha,vec3(.29,.19,.105)*(.78+.18*cos(p.y*15.)*trunkDetail+.2*clamp((p.x-tx)/.22,-1.,1.)),trunk);
  vec2 crown=vec2(bend,H);
  if(h<.78){
    // Six drooping pinnate fronds plus an upright spear. Curved rachises and
    // alternating narrow leaflets give palms an unmistakable open silhouette.
    for(int f=0;f<6;f++){
      float sideF=f<3?-1.:1.,layer=mod(float(f),3.);
      float span=3.+layer*.55+h*.65,t=(p.x-crown.x)*sideF/span;
      if(t< -foliageAA/span||t>1.+foliageAA/span)continue;
      float tc=clamp(t,0.,1.);
      float axisY=H+(2.-layer*.62)*tc-(2.25+layer*.38)*tc*tc;
      // Leaflet notches converge to their mean coverage once unresolved instead
      // of alternately appearing and disappearing as a subpixel frond moves.
      float resolved=1.-smoothstep(.35,1.4,foliageAA*38./span);
      float leafWidth=(.12+.29*sin(tc*3.14159))*mix(.803775,.46+.54*abs(sin(tc*38.+h*4.)),resolved);
      float slope=((2.-layer*.62)-2.*(2.25+layer*.38)*tc)/span;
      float normalScale=inversesqrt(1.+slope*slope);
      float frond=foliageBand((p.y-axisY)*normalScale,leafWidth*normalScale,foliageAA)*foliageSpan(t*span,0.,span,foliageAA);
      if(frond>.001)foliagePaint(c,alpha,mix(vec3(.025,.13,.055),vec3(.11,.29,.075),.35+.35*sideF+.15*layer)*(.88+.12*cos(tc*38.)*resolved),frond);
    }
    float spear=leaf2(p,crown,crown+vec2(.4*side,2.3),.18);
    if(spear>.001)foliagePaint(c,alpha,vec3(.12,.31,.09),spear);
    float fruit=step(length((p-crown-vec2(.12,-.18))/vec2(.25,.2)),1.);
    if(fruit>.5){alpha=1.;c=vec3(.19,.13,.055);}
  }else{
    // Broad, overlapping leaves form a lower, rounded tropical canopy.
    for(int f=0;f<9;f++){
      float angle=float(f)*2.4+h*8.;
      vec2 base=crown+vec2(sin(angle)*.35,cos(angle)*.25-.65);
      vec2 tip=base+vec2(sin(angle)*2.25,cos(angle)*1.45+.35);
      float leaf=leaf2(p,base,tip,.72);
      if(leaf>.001){float vein=1.-smoothstep(.012,.045,line2(p,base,tip));foliagePaint(c,alpha,mix(vec3(.035,.18,.065),vec3(.12,.29,.075),fract(float(f)*.37+h))+vec3(.05,.06,.01)*vein,leaf);}
    }
  }
  return vec4(c,alpha);
}
vec4 tropicalBorder(vec2 p,float h,float sight){
  vec3 c=vec3(0.);float alpha=0.;
  // Ferns and colorful cordyline-like leaves grow in layered clumps.
  if(h<.78)for(int f=0;f<7;f++){
    float a=(float(f)-3.)*.4;
    vec2 base=vec2(-.75,0.),tip=base+vec2(sin(a)*1.45,cos(a)*(1.25+.25*h));
    float leaf=leaf2(p,base,tip,.2);
    float t=dot(p-base,tip-base)/dot(tip-base,tip-base);
    float phaseAA=foliageAA*27./length(tip-base);
    float resolved=1.-smoothstep(.35,1.4,phaseAA);
    leaf*=mix(.85879,smoothstep(.22-phaseAA,.22+phaseAA,abs(sin(t*27.))),resolved);
    if(leaf>.001)foliagePaint(c,alpha,mix(vec3(.035,.19,.075),vec3(.12,.32,.09),float(f)/7.),leaf);
  }
  if(h>.2&&h<.72)for(int f=0;f<5;f++){
    vec2 base=vec2(.7,0.),tip=base+vec2((float(f)-2.)*.42,1.1+.3*sin(float(f)+h));
    float leaf=leaf2(p,base,tip,.22);
    if(leaf>.001)foliagePaint(c,alpha,mix(vec3(.24,.045,.085),vec3(.44,.12,.16),float(f)/5.),leaf);
  }
  if(h<.3){
    // Upright heliconia stems with alternating boat-shaped orange/red bracts.
    for(int stem=0;stem<2;stem++){
      float sx=-.13+float(stem)*.48,top=1.45+float(stem)*.3;
      if(line2(p,vec2(sx,.05),vec2(sx,top))<.025){alpha=1.;c=vec3(.08,.23,.065);}
      for(int k=0;k<4;k++){
        float sideK=mod(float(k+stem),2.)*2.-1.,by=.55+float(k)*.23+float(stem)*.1;
        vec2 base=vec2(sx,by),tip=base+vec2(sideK*.5,.21);
        if(leaf2(p,base,tip,.13)>.5){alpha=1.;c=mix(vec3(.65,.055,.03),vec3(.95,.27,.035),float(k)/4.);}
      }
    }
  }else if(h>.62&&h<.9){
    // Recognizable five-petalled flowers in pink and purple roadside clusters.
    for(int fl=0;fl<5;fl++){
      vec2 center=vec2((float(fl)-2.)*.28,.65+.42*sin(float(fl)*1.4+h));
      if(line2(p,vec2(center.x*.7,0.),center)<.018){alpha=1.;c=vec3(.05,.2,.055);}
      for(int petal=0;petal<5;petal++){
        float a=float(petal)*1.2566;vec2 d=p-center-vec2(sin(a),cos(a))*.105;
        if(length(d/vec2(.095,.095))<1.){alpha=1.;c=mix(vec3(.47,.07,.31),vec3(.68,.19,.44),h);}
      }
      if(length(p-center)<.04){alpha=1.;c=vec3(.95,.63,.11);}
    }
  }
  // Occasional toucan-like bird, resting on a woody branch above the flowers.
  if(sight<.055){
    vec2 perch=vec2(.25,1.9);
    if(line2(p,vec2(.8,.1),perch+vec2(.35,-.08))<.045||line2(p,perch-vec2(.1,.1),perch+vec2(.55,-.1))<.035){alpha=1.;c=vec3(.22,.13,.07);}
    vec2 q=p-perch;
    float bird=step(length((q-vec2(0.,.22))/vec2(.24,.3)),1.);
    bird=max(bird,leaf2(q,vec2(-.04,.08),vec2(-.34,-.28),.085));
    if(bird>.5){alpha=1.;c=vec3(.025,.055,.085);}
    if(length((q-vec2(.12,.47))/vec2(.16,.17))<1.){alpha=1.;c=vec3(.035,.07,.08);}
    if(length((q-vec2(.1,.3))/vec2(.1,.13))<1.){alpha=1.;c=vec3(.9,.72,.23);}
    if(leaf2(q,vec2(.2,.5),vec2(.68,.42),.13)>.5){alpha=1.;c=vec3(.94,.36,.035);}
    if(length(q-vec2(.17,.5))<.025){alpha=1.;c=vec3(.005);}
  }
  // A small lizard rests on a low rock, off the riding surface.
  if(sight>.94){
    vec2 q=p-vec2(.2,.24);
    if(length((p-vec2(.15,.09))/vec2(.72,.22))<1.){alpha=1.;c=vec3(.26,.23,.17);}
    float liz=step(length(q/vec2(.27,.09)),1.);
    liz=max(liz,step(length((q-vec2(.29,.03))/vec2(.1,.075)),1.));
    float tailY=.04*sin((q.x+.27)*7.);
    liz=max(liz,step(-.85,q.x)*step(q.x,-.18)*step(abs(q.y-tailY),.035*(q.x+.9)/.72));
    for(int leg=0;leg<4;leg++){
      float sideL=mod(float(leg),2.)*2.-1.,lx=leg<2?-.13:.14;
      liz=max(liz,step(line2(q,vec2(lx,0.),vec2(lx-.08,sideL*.19)),.025));
    }
    if(liz>.5){alpha=1.;c=vec3(.15,.27,.08)*(1.+.18*sin(q.x*31.));}
  }
  return vec4(c,alpha);
}

// Small, non-emissive roadside details. p is metres from a roadside ground point:
// x across the path, y up. h is the existing stable per-row random number in [0,1].
// Call AFTER the row's depth/terrain rejection, only within abs(p.x)<1.5 and -.16<p.y<1.35.
// Returns straight RGB + coverage; multiply RGB by the scene's existing lighting/fog.
// Fixed upper bound: three stems, five petals each, one small animal. No texture reads.
float epHash(float v){return fract(sin(v*127.13+3.7)*43758.5453);}
float epCross(vec2 a,vec2 b){return a.x*b.y-a.y*b.x;}
float epLine(vec2 p,vec2 a,vec2 b,float width,float aa){
  vec2 ab=b-a;float q=clamp(dot(p-a,ab)/max(dot(ab,ab),.00001),0.,1.);
  return foliageBand(length(p-a-ab*q),width,aa);
}
float epOval(vec2 p,vec2 r,float aa){
  float d=(length(p/r)-1.)*min(r.x,r.y);
  return (1.-smoothstep(-aa,aa,d))*min(1.,min(r.x,r.y)/aa);
}
float epTriangle(vec2 p,vec2 a,vec2 b,vec2 c,float aa){
  vec2 e0=b-a,e1=c-b,e2=a-c;float side=sign(epCross(e0,c-a));
  float d=min(side*epCross(e0,p-a)/length(e0),min(side*epCross(e1,p-b)/length(e1),side*epCross(e2,p-c)/length(e2)));
  return smoothstep(-aa,aa,d);
}
vec4 epPaint(vec4 base,vec3 pigment,float mask){
  float m=clamp(mask,0.,1.),a=m+base.a*(1.-m);
  return vec4((pigment*m+base.rgb*base.a*(1.-m))/max(a,.00001),a);
}
// A lance-shaped leaf or petal: pointed at both ends, widest halfway along its length.
float epLance(vec2 p,vec2 root,vec2 tip,float width,float aa){
  vec2 d=tip-root;float len=length(d);d/=max(len,.0001);
  vec2 q=vec2(epCross(d,p-root),dot(d,p-root));
  float w=width*sin(3.14159265*clamp(q.y/len,0.,1.));
  return foliageBand(q.x,w,aa)*foliageSpan(q.y,0.,len,aa);
}
vec4 seasonalPlants(vec2 p,float h,float coast,float meadow,float alpine,float canyon){
  vec4 outp=vec4(0.);
  float floral=clamp(coast*.8+meadow+alpine*.75,0.,1.);
  if(abs(p.x)>1.5||p.y<-.16||p.y>1.35||floral+canyon<.002)return outp;
  float aa=foliageAA;
  vec3 stem=vec3(.085,.15,.035);
  if(floral>.002&&h>.18){
    for(int i=0;i<3;i++){
      float v=epHash(h*81.+float(i)*7.3),x=-.72+float(i)*.61+(v-.5)*.18;
      float tall=(.38+v*.4)*(1.-alpine*.35),lean=(v-.5)*.26;
      vec2 foot=vec2(x,0.),tip=vec2(x+lean,tall);
      outp=epPaint(outp,stem,epLine(p,foot,tip,.012,aa)*floral);
      vec2 leaf=foot+(tip-foot)*.35;
      outp=epPaint(outp,stem*1.12,epLance(p,leaf,leaf+vec2(-.17,.13),.034,aa)*floral);
      leaf=foot+(tip-foot)*.57;
      outp=epPaint(outp,stem*.9,epLance(p,leaf,leaf+vec2(.15,.12),.028,aa)*floral);
      vec3 flower=v<.34?vec3(.62,.36,.055):v<.68?vec3(.42,.075,.19):vec3(.28,.09,.36);
      // Alpine patches are mostly violet and butter yellow; coastal flowers include pink thrift.
      if(alpine>.5)flower=v<.52?vec3(.31,.12,.38):vec3(.61,.39,.075);
      float size=.105+v*.035;
      for(int k=0;k<5;k++){
        float angle=float(k)*1.256637+v*3.;vec2 dir=vec2(cos(angle),sin(angle));
        outp=epPaint(outp,flower,epLance(p,tip,tip+dir*size,.038,aa)*floral);
      }
      outp=epPaint(outp,vec3(.35,.20,.035),epOval(p-tip,vec2(.025),aa)*floral);
    }
  }
  // A low prickly pear complements the tall canyon saguaros; blooms are small and seasonal.
  if(canyon>.002&&h>.36&&h<.86){
    float x=-.25+(h-.5)*.7;
    float pad=epOval(p-vec2(x,.24),vec2(.15,.25),aa);
    pad=max(pad,epOval(p-vec2(x-.15,.43),vec2(.12,.19),aa));
    pad=max(pad,epOval(p-vec2(x+.17,.34),vec2(.13,.18),aa));
    outp=epPaint(outp,vec3(.12,.22,.115),pad*canyon);
    outp=epPaint(outp,vec3(.065,.115,.055),epLine(p,vec2(x,.05),vec2(x,.44),.007,aa)*canyon);
    vec2 top=vec2(x-.15,.62);
    for(int k=0;k<5;k++){
      float angle=.2+float(k)*.68;vec2 dir=vec2(cos(angle),sin(angle));
      outp=epPaint(outp,vec3(.64,.22,.075),epLance(p,top,top+dir*.085,.024,aa)*canyon);
    }
  }
  float birdWeight=coast*step(.91,h)+meadow*step(.88,h)+alpine*step(.955,h);
  if(birdWeight>.002){
    // Ground/perched bird: two fine legs, pointed tail and beak, layered wing, separate head.
    vec2 b=p-vec2(.38,.13);b.x*=h>.96?-1.:1.;
    float scale=1.+coast*.3;b/=scale;
    vec3 feather=mix(vec3(.23,.145,.085),vec3(.49,.52,.49),coast);
    feather=mix(feather,vec3(.24,.255,.24),alpine);
    outp=epPaint(outp,vec3(.18,.11,.045),max(epLine(b,vec2(-.055,.07),vec2(-.065,-.1),.011,aa),epLine(b,vec2(.035,.07),vec2(.055,-.1),.011,aa))*birdWeight);
    outp=epPaint(outp,feather*.65,epTriangle(b,vec2(-.12,.15),vec2(-.39,.26),vec2(-.19,.035),aa)*birdWeight);
    outp=epPaint(outp,feather,epOval(b-vec2(0.,.18),vec2(.21,.135),aa)*birdWeight);
    outp=epPaint(outp,feather*.64,epLance(b,vec2(.09,.22),vec2(-.21,.12),.07,aa)*birdWeight);
    outp=epPaint(outp,mix(vec3(.38,.105,.04),feather,coast+alpine),epOval(b-vec2(.12,.16),vec2(.075,.09),aa)*birdWeight);
    outp=epPaint(outp,feather*1.05,epOval(b-vec2(.17,.32),vec2(.09,.085),aa)*birdWeight);
    outp=epPaint(outp,vec3(.33,.22,.055),epTriangle(b,vec2(.235,.345),vec2(.36,.31),vec2(.23,.29),aa)*birdWeight);
    outp=epPaint(outp,vec3(.012,.016,.01),epOval(b-vec2(.20,.34),vec2(.012),aa)*birdWeight);
  }
  if(canyon>.002&&h>.91){
    // A small desert lizard on a sun-warmed rock, with tapered tail and four angular legs.
    vec2 b=p-vec2(.15,.11);b.x*=h>.96?-1.:1.;
    outp=epPaint(outp,vec3(.30,.21,.13),epOval(b-vec2(0.,-.06),vec2(.53,.18),aa)*canyon);
    vec3 skin=vec3(.29,.27,.11);
    for(int k=0;k<2;k++){
      float side=k==0?-1.:1.;
      float legs=epLine(b,vec2(-.11,.04),vec2(-.21,.04+side*.13),.015,aa);
      legs=max(legs,epLine(b,vec2(-.21,.04+side*.13),vec2(-.29,.02+side*.15),.012,aa));
      legs=max(legs,epLine(b,vec2(.13,.04),vec2(.18,.04+side*.12),.015,aa));
      legs=max(legs,epLine(b,vec2(.18,.04+side*.12),vec2(.28,.02+side*.16),.012,aa));
      outp=epPaint(outp,skin*.8,legs*canyon);
    }
    outp=epPaint(outp,skin,epTriangle(b,vec2(-.16,-.015),vec2(-.65,.10),vec2(-.15,.09),aa)*canyon);
    outp=epPaint(outp,skin,epOval(b-vec2(0.,.04),vec2(.23,.067),aa)*canyon);
    outp=epPaint(outp,skin*1.16,epTriangle(b,vec2(.17,-.015),vec2(.37,.045),vec2(.17,.11),aa)*canyon);
    outp=epPaint(outp,vec3(.11,.12,.045),epLine(b,vec2(-.17,.04),vec2(.24,.055),.012,aa)*canyon);
    outp=epPaint(outp,vec3(.012,.014,.006),epOval(b-vec2(.265,.069),vec2(.011),aa)*canyon);
  }
  return outp;
}

vec4 autumnTree(vec2 p,float h){
          float scale=.47+h*.3, aa=foliageAA/scale;
          vec2 q=p/scale;float crown=0.;
          for(int leaf=0;leaf<12;leaf++){
            float f=float(leaf),ang=f*2.399+h*3.;
            vec2 center=vec2(cos(ang)*(1.5+.35*sin(f*3.+h)),6.2+sin(ang)*(1.6+.35*cos(f*2.1)));
            crown=max(crown,epOval(q-center,vec2(1.12+h*.35,1.4+h*.3),aa));
          }
          float trunkA=epLine(q,vec2(0.,0.),vec2(.12,6.6),.14,aa);
          trunkA=max(trunkA,epLine(q,vec2(0.,3.7),vec2(-1.7,6.7),.08,aa));
          trunkA=max(trunkA,epLine(q,vec2(0.,4.4),vec2(1.7,7.4),.07,aa));
          vec3 leafC=h<.44?vec3(.32,.035,.012):h<.73?vec3(.46,.12,.015):vec3(.42,.26,.025);
          leafC*=.6+.55*fbm2(q*1.1+h*21.)+.18*smoothstep(-3.,3.,q.x);
          return vec4(mix(vec3(.12,.09,.065),leafC,crown),max(crown,trunkA));
}

const float SEA=-14.;
float mistyHeight(vec2 p,bool hi){
  float px=pathX(p.y),ry=roadY(p.y),d=abs(p.x-px);
  float t=smoothstep(4.,46.,d);
  vec2 q=p*.0088+uSeed*3.;
  q+=.55*vec2(vn(q*.73+1.3),vn(q*.73+4.1));          // bends the noise lattice out of sight
  float n=hi?fbm4(q):fbm2(q);
  float r=1.-abs(2.*fbm2(q*.63+9.)-1.);
  float m=mix(n,r*r,uRidge);
  float mid=vn(q*4.3+5.3)-.5;
  float h=ry+t*max(0.,m-.27+mid*.16)*uAmp*(1.+d*.0016);
  float far=smoothstep(110.,430.,d);
  if(far>0.){float rr=1.-abs(2.*fbm2(q*.31+2.7)-1.);h+=far*rr*rr*uAmp*1.5;}
  if(uTrees>0.)h+=smoothstep(4.,22.,d)*uTrees*pow(vn(p*.19),3.)*5.;
  if(uSea>0.){float side=smoothstep(7.,70.,p.x-px);h=mix(h,SEA-5.,side*uSea);}
  return h;
}
float mistySurface(vec2 p,bool hi){float h=mistyHeight(p,hi);return uSea>0.?max(h,SEA):h;}
float mistyMarch(vec3 ro,vec3 rd,out float last){
  float t=.8,h=0.;last=0.;
  for(int i=0;i<76;i++){
    vec3 p=ro+rd*t;h=p.y-mistySurface(p.xz,false);
    if(h<.002*t||t>680.)break;

vec3 mistyNebula(vec3 rd,float s){

vec3 mistySky(vec3 rd,vec2 sv){

  }

vec4 mistyWorld(vec3 ro,vec3 rd,vec2 sv){

float height(vec2 p,bool hi){

  if(uCoast>.001){
    float coast=ry+shoulder*(4.+n*16.)*smoothstep(2.,60.,-dx);
    coast=mix(coast,SEA-5.,smoothstep(5.,21.,dx));
    vec2 stack=vec2(dx-58.,mod(p.y+uSeed*17.,135.)-67.5);
    coast=max(coast,SEA-4.+26.*(1.-smoothstep(7.,15.,length(stack))));
    h+=coast*uCoast;
  }
  if(uForest>.001)h+=(ry+shoulder*(.2+n*.9)+smoothstep(35.,150.,d)*n*6.)*uForest;
  if(uMeadow>.001)h+=(ry+shoulder*(n-.35)*5.+smoothstep(20.,180.,d)*n*14.)*uMeadow;
  if(uAlpine>.001){
    // A left-hand lake and a close right-hand bluff, with wooded hills beyond.
    float bluff=smoothstep(14.+n*4.,42.+n*9.,dx)*(24.+n*32.);
    float farHill=smoothstep(65.,160.,d)*(12.+fbm2(q*.8+3.)*28.);
    float shore=ry+shoulder*.85+bluff+farHill;
    float lake=smoothstep(5.,18.,-dx)*(1.-smoothstep(235.,285.,-dx));
    float canopy=smoothstep(6.,15.,d)*(1.-lake)*pow(vn(p*.16),2.)*2.5;
    h+=(mix(shore,SEA-7.,lake)+canopy)*uAlpine;
  }
  if(uCanyon>.001){
    float wall=smoothstep(12.+n*12.,23.+n*16.,d);
    h+=(ry+shoulder*1.2+wall*(22.+floor(n*5.)*7.))*uCanyon;
  }
  if(uMisty>.001)h+=mistyHeight(p,hi)*uMisty;
  // Land weights sum to 1-uOrbit during a space transition; preserve the
  // full shared route elevation so the temporary ground stays under the camera.
  return h+ry*(uOrbit+uSnake);
}
float surface(vec2 p,bool hi){float h=height(p,hi);return mix(h,max(h,SEA),uSea);}
float march(vec3 ro,vec3 rd,out float last){

float skyTrail=0.;

// A sky-fixed star field and original ringed planet. No animated sparkle or

vec3 orbitSky(vec3 rd){
  vec3 c=mix(vec3(.006,.009,.032),vec3(.018,.013,.055),.5+.5*rd.y);
  vec2 cloud=vec2(rd.x*3.2+rd.z*.8,rd.y*3.4+rd.z*.3)+uSeed*.17;

  vec2 cell=floor(uv),f=fract(uv)-.5;

  if(h>.92){
    float radius=.025+.055*fract(h*91.);
    float aa=max(.025,70./uRes.y);

  }

  vec3 pr=normalize(cross(vec3(0.,1.,0.),center)),pu=cross(center,pr);

    float aa=2./uRes.y,rad=length(vec2(r.x,r.y/.26));

    vec3 ringC=mix(vec3(.12,.18,.28),vec3(.31,.25,.16),smoothstep(.26,.41,rad));
    ringC*=.8+.2*sin(rad*75.);

    if(disk>0.){

vec3 orbitRainbow(float x){
  float s=clamp(x,0.,.9999)*6.,i=floor(s),f=s-i;

  else if(i<2.){a=vec3(.72,.19,.025);b=vec3(.64,.53,.035);}
  else if(i<3.){a=vec3(.64,.53,.035);b=vec3(.035,.36,.13);}
  else if(i<4.){a=vec3(.035,.36,.13);b=vec3(.025,.36,.55);}
  else if(i<5.){a=vec3(.025,.36,.55);b=vec3(.065,.12,.58);}
  else{a=vec3(.065,.12,.58);b=vec3(.37,.065,.49);}

// Intersect a finite ribbon, without an infinite ground plane below it. A missed
// crossing continues to the next hill so the track can curve across open space.
float orbitMarch(vec3 ro,vec3 rd){
  float a=.2,ga=ro.y+rd.y*a-roadY(ro.z+rd.z*a);
  for(int i=0;i<120;i++){
    if(a>=680.)break;
    float b=min(680.,a+max(.55,a*.042));
    vec3 p=ro+rd*b;float gb=p.y-roadY(p.z);

      float lo=a,hi=b,glo=ga;
      for(int j=0;j<6;j++){
        float m=(lo+hi)*.5;vec3 q=ro+rd*m;float gm=q.y-roadY(q.z);
        if(glo*gm>0.){lo=m;glo=gm;}else hi=m;
      }
      float hit=(lo+hi)*.5;vec3 q=ro+rd*hit;
      if(abs(q.x-pathX(q.z))<uWidth)return hit;
    }

  }

}
vec3 orbitWorld(vec3 ro,vec3 rd){
  vec3 space=orbitSky(rd),c=space;
  float t=orbitMarch(ro,rd);
  if(t<680.){
    vec3 p=ro+rd*t;float dx=p.x-pathX(p.z),d=abs(dx);
    c=orbitRainbow((dx/uWidth+1.)*.5)*(.8+.12*pow(1.-d/uWidth,2.));
    float seam=1.-smoothstep(.025,.07,uWidth-d);
    c=mix(c,vec3(.36,.42,.58),seam*.8);
    // A calm continuous edge glow gives the floating road a visible boundary.
    c+=vec3(.055,.09,.15)*exp(-pow((d-uWidth+.14)/.12,2.));
    c=mix(c,space,smoothstep(370.,680.,t));
  }
  if(rd.z>.02){
    // Sparse orbital gantries repeat every 140 m, with open centers and a low
    // blue-metal frame. Their fixed positions give depth without a flashing pattern.
    for(int k=4;k>=0;k--){
      float z=(floor(ro.z/140.)+float(k)+1.)*140.;
      float ot=(z-ro.z)/rd.z;
      if(ot>t||ot>620.||ot<.3)continue;
      vec3 p=ro+rd*ot;vec2 q=vec2(p.x-pathX(z),p.y-roadY(z));

      float radius=uWidth+.32;
      float frame=foliageBand(length(q)-radius,.085,aa)*smoothstep(-aa,aa,q.y);
      float inset=foliageBand(length(q)-(radius-.12),.025,aa)*smoothstep(-aa,aa,q.y);
      vec3 arch=mix(vec3(.035,.07,.15),vec3(.16,.24,.4),clamp(q.y/radius,0.,1.));
      c=mix(c,arch,frame*(1.-smoothstep(420.,620.,ot)));
      c=mix(c,vec3(.22,.34,.51),inset*.65*(1.-smoothstep(420.,620.,ot)));
    }
    // Continuous low guardrails are real capsules above the ribbon, so open
    // space is visible between their illuminated tops and the track surface.
    for(int k=0;k<22;k++){
      float za=(floor(ro.z/14.)+float(k))*14.,zb=za+14.;
      for(int side=0;side<2;side++){
        float sg=side==0?-1.:1.;
        vec3 a=vec3(pathX(za)+sg*(uWidth+.08),roadY(za)+.38,za);
        vec3 b=vec3(pathX(zb)+sg*(uWidth+.08),roadY(zb)+.38,zb);
        vec3 ba=b-a,oa=ro-a;
        float bb=dot(ba,ba),br=dot(ba,rd),bo=dot(ba,oa),rr=dot(rd,oa);
        float aa=bb-br*br,ab=bb*rr-bo*br,ac=bb*dot(oa,oa)-bo*bo-.0036*bb;
        float disc=ab*ab-aa*ac;if(disc<0.||aa<.001)continue;
        float rt=(-ab-sqrt(disc))/aa,y=bo+rt*br;
        if(rt<.1||rt>t||y<0.||y>bb)continue;
        c=mix(c,vec3(.19,.27,.42),1.-smoothstep(180.,310.,rt));
      }
    }
  }
  return c*(1.-uDusk*.24);
}


float cloudHeight(vec2 p){
  // Overlapping, differently sized cloud domes. The nine neighboring cells
  // cover boundaries continuously; fixed world positions never boil or flicker.
  vec2 cell=floor(p/32.);float top=-36.;
  for(int ix=-1;ix<=1;ix++)for(int iz=-1;iz<=1;iz++){
    vec2 id=cell+vec2(float(ix),float(iz));

    vec2 center=(id+.5+vec2(sin(h*31.),cos(h*47.))*.12)*32.;
    float radius=23.+h*6.,d2=dot(p-center,p-center);
    if(d2<radius*radius)top=max(top,-36.+sqrt(radius*radius-d2)*.8+h*2.);
  }
  return top;
}
vec3 snakeSky(vec3 ro,vec3 rd){

  float sun=max(dot(rd,normalize(vec3(-.5,.32,1.))),0.);

  if(rd.y<.12){

      if (S.biomeT < 1) { S.biomeT = Math.min(1, S.biomeT + dtMs / 6000); if (S.biomeT === 1) S.fromMix = null; }
      if (S.autoScene && !ride.replayOn && S.dist >= S.nextSceneAt) {
        S.nextSceneAt = S.dist + M_PER_MI;
        nextBiome();
        shell.toast(`New scenery · ${BIOMES[S.biomeNext].name}`);
      }
      if (frameIdx > 2 && (!thumbAt || (now - thumbAt > 4000 && Math.abs(S.dusk - thumbDusk) > 0.04 && !document.body.classList.contains('quiet')))) drawThumbs(now);
      S.dusk = S.duskHold != null ? S.dusk + (S.duskHold - S.dusk) * Math.min(1, dtMs / 900) : RM.matches ? S.dusk : 0.5 - 0.5 * Math.cos((now / 1000 / 240 + 0.14) * Math.PI * 2);

      // React to sustained stalls before waiting 90 expensive frames. This also
      // covers browsers that hide renderer metadata and genuinely weak GPUs.
      if (frameMs > 120) stalled++; else stalled = 0;
      if (frameMs > 26) slow++; else if (frameMs < 20) fast++;
      frameIdx++;
      if (stalled >= 2 && lastScale > minScale) {
        lastScale = Math.max(minScale, lastScale * .5); resize();
        stalled = 0; slow = 0; fast = 0;
      } else if (frameIdx % 15 === 0 && slow > 10 && lastScale > minScale) {
        lastScale = Math.max(minScale, lastScale * .75); resize();
        slow = 0; fast = 0;
      } else if (frameIdx % 90 === 0) {
        if (fast > 80 && lastScale < maxScale) { lastScale = Math.min(maxScale, lastScale * 1.2); resize(); }
        slow = 0; fast = 0;
      }

      /* uniforms */
      const land = landAt(S.fromMix || BIOMES[S.biome], BIOMES[S.biomeNext], S.biomeT, S.dusk);
      const z = S.vis;
      const curveRoll = RM.matches ? 0 : clamp((pathX(z + 12) - 2 * pathX(z + 6) + pathX(z)) * 0.012, -0.07, 0.07);
      S.roll += (curveRoll - S.roll) * Math.min(1, dtMs / 200);
      const cam = camAt(z, S.roll), right = cam.right, up = cam.up, fwd = cam.fwd;
      const camX = cam.cx, camY = cam.cy + (RM.matches ? 0 : Math.sin(S.vis * 0.9) * 0.018 * motion01(S.rpm));
      const focal = 1.08;

      for (let i = 0; i < BANDS; i++) {
        // A far range that drifts past as you ride: stated value noise, not a measurement.
        const x = i * 0.23 + S.vis * 0.0012 + S.seed;
        const n = 0.5 * Math.sin(x * 1.7) + 0.3 * Math.sin(x * 3.1 + 1.3) + 0.2 * Math.sin(x * 6.3 + 2.1);
        ridge[i] = 0.16 + 0.12 * n + 0.08 * motion01(S.rpm);
        specBytes[i] = Math.round(Math.max(0, Math.min(1, ridge[i])) * 255);
      }
      G.bindTex(1, tSpec);
      gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, BANDS, 1, gl.RED, gl.UNSIGNED_BYTE, specBytes);

      const beatLen = Math.max(6, (S.rpm > 5 ? 60 / S.rpm : 0.6) * Math.max(10, S.speed));   // one dash per revolution

      /* scene */
      gl.disable(gl.BLEND);
      G.into(scene);
      G.bindTex(0, tNoise); G.bindTex(1, tSpec);
      G.use(pScene, Object.assign({
        uN: 0, uS: 1, uRes: [rw, rh], uT: now / 1000, uFocal: focal, uBeat: beatLen, uSeed: S.seed,
        uCam: [camX, camY, z], uRight: right, uUp: up, uFwd: fwd,
        uSpark: 0.12 * motion01(S.rpm),
      }, land));
      G.draw();

      /* motes */
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
      G.use(pMote, { uCam: [camX, camY, z], uRight: right, uUp: up, uFwd: fwd, uFocal: focal, uAsp: rw / rh, uZ: z, uPx: rh * 0.09, uSeed: S.seed, uSpeedN: motion01(S.rpm), uSpark: .12 * land.uMisty, uShimmer: .1 * land.uMisty, uEdge: land.uEdge, uRouteA: land.uRouteA, uRouteB: land.uRouteB, uRouteC: land.uRouteC, uRouteD: land.uRouteD, uRouteE: land.uRouteE });
      if(S.look !== 'clear' || land.uMisty > .001) gl.drawArrays(gl.POINTS, 0, Math.round(650 + 850 * land.uMisty));
      gl.disable(gl.BLEND);

      /* feedback */
      const asp = rw / rh;
      const vpP = [pathX(z + 90) - camX, roadY(z + 90) + 1 - camY, 90];
      const cz = vpP[0] * fwd[0] + vpP[1] * fwd[1] + vpP[2] * fwd[2];
      const vp = [0.5 + ((vpP[0] * right[0] + vpP[1] * right[1] + vpP[2] * right[2]) * focal) / cz / asp / 2, 0.5 + ((vpP[0] * up[0] + vpP[1] * up[1] + vpP[2] * up[2]) * focal) / cz / 2];
      const fpsScale = dtMs / 16.67;
      const zoomNow = RM.matches ? S.zoom * 0.4 : 1 - Math.pow(1 - (S.zoom + 0.0012), fpsScale);
      G.into(dreamB);
      G.bindTex(0, scene.tex); G.bindTex(1, dreamA.tex);
      G.use(pDream, { uScene: 0, uPrev: 1, uVP: vp, uZoom: zoomNow, uDream: RM.matches ? S.dream * 0.5 : S.dream, uWild: S.wild, uT: now / 1000 });
      G.draw();
      const tmp = dreamA; dreamA = dreamB; dreamB = tmp;

      /* bloom and grade */
      const bloom = Post.bloom(dreamA.tex, 1.15);
      Post.finish(dreamA.tex, bloom, {
        uBloomK: 0.25, uExposure: 0.98 + S.dusk * 0.25,
        uFlash: 0, uFlashC: [1, 0.93, 0.82], uGrain: 0.022, uT: now / 1000, uVig: 0.25, uSat: 1.02, rate: RM.matches ? 0.16 : 0.36, maxGain: 1,
      }, dtMs / 1000);

      if (lumaRec) lumaRec(now);
      if (wantSnap) { const done = wantSnap; wantSnap = null; cv.toBlob((blob) => done(blob), 'image/png'); }

      /* readouts */
      if (frameIdx % 6 === 0) {
        $('g-speed').textContent = ((S.speed * 3600) / M_PER_MI).toFixed(1);
        $('g-dist').textContent = (S.dist / M_PER_MI).toFixed(2);
        const heroVal = S.rpm > 0.5 ? Math.round(S.rpm) : '--';
        $('g-hero').textContent = heroVal;
        if ($('route-sheet').open) { drawElStrip(); drawCurve(); }
      }
    } catch (e) {
      if (fails++ < 3) console.error(e);
    }
  }

  /* ---- boot ---- */
  if (!G) {
    shell.glFail('This page draws with WebGL2, which this browser did not provide. The cadence readings below still work.');
    const idle = (now) => { requestAnimationFrame(idle); ride.tick(now); pageFrame(now); };
    requestAnimationFrame(idle);
  } else {
    gl = G.gl;
    try {
      Post = createPost(G);
      pScene = G.program(SCENE_FS);
      pDream = G.program(DREAM_FS);
      pMote = G.program(MOTE_FS, MOTE_VS);
      tNoise = G.noiseTexture(20261102);
      tSpec = G.tex(BANDS, 1, { internal: gl.R8, format: gl.RED, type: gl.UNSIGNED_BYTE });
      resize();
      addEventListener('resize', resize);
      cv.addEventListener('webglcontextlost', (e) => { e.preventDefault(); shell.glFail('The graphics context was lost. Reload the page to get the picture back.'); });
      requestAnimationFrame(render);
    } catch (e) {
      console.error(e);
      shell.glFail(`The picture could not start on this graphics card: ${String(e.message).slice(0, 140)}`);
    }
  }

  // For the flicker check: record the picture's brightness on a small grid, on every frame, straight after it is drawn.
  let lumaRec = null;
  function recordLuma(ms) {
    const c = document.createElement('canvas'); c.width = 64; c.height = 36;
    const g = c.getContext('2d', { willReadFrequently: true }), frames = [], t0 = performance.now();
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';        // a true area average, not a few sampled pixels
    return new Promise((res) => {
      lumaRec = (now) => {
        g.drawImage(cv, 0, 0, 64, 36);
        const d = g.getImageData(0, 0, 64, 36).data, grid = [];
        for (let i = 0; i < d.length; i += 4) grid.push(+(0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]).toFixed(1));
        frames.push({ t: +(now - t0).toFixed(1), grid });
        if (now - t0 > ms) { lumaRec = null; res(frames); }
      };
    });
  }

  /* for the checks: read what is really on the canvas and in the engine */
  window.__app = {
    S, ride, BIOMES, pathX, roadY, gradeAt, motion01, step, sceneNow, recordLuma, setBiome, nextBiome, setTod, setLook, setAuto, drawThumbs,
    get renderInfo() { return { softwareRenderer, width: rw, height: rh, pixelBudget: sceneBudget * lastScale }; },
    pixel() {
      const c = document.createElement('canvas'); c.width = 32; c.height = 18;
      const g = c.getContext('2d');
      return new Promise((res) => { wantSnap = (blob) => { const im = new Image(); im.onload = () => { g.drawImage(im, 0, 0, 32, 18); const d = g.getImageData(0, 0, 32, 18).data; let sum = 0, min = 1e9, max = 0; const grid = []; for (let i = 0; i < d.length; i += 4) { const l = d[i] * 0.2126 + d[i + 1] * 0.7152 + d[i + 2] * 0.0722; sum += l; min = Math.min(min, l); max = Math.max(max, l); grid.push(l); } res({ mean: sum / (d.length / 4), min, max, grid }); }; im.src = URL.createObjectURL(blob); }; });
    },
  };
})();

</script>
</body>
</html>
