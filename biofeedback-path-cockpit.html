<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101525">
<title>Biofeedback Path Cockpit</title>
<meta name="description" content="A road whose weather, grade and fog follow your body. Cadence is measured from a sensor, and everything about your state is inferred. Not a medical device.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101525'/%3E%3Cpath d='M5 17h6l2.5-6 4 11 2.5-5H27' fill='none' stroke='%23b8b7ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --bg: #101525;
  --ink: #eeedfb;
  --muted: #b6b9cf;
  --faint: #8d93ad;
  --accent: #b8b7ff;
  --line: rgba(191, 194, 236, 0.17);
  --glass: rgba(24, 28, 46, 0.72);
  --sheet: #1a2032;
  --soft: rgba(184, 183, 255, 0.1);
  --shadow: rgba(2, 6, 19, 0.45);
  --good: #bfe8a6;
  --warn: #f1cf8e;
  --bad: #f4a3a3;
  --demo: #e6c7a3;
  --serif: Georgia, "Times New Roman", serif;
  --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 400; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; }
button, a, input, select { touch-action: manipulation; }
button { color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
a { color: var(--accent); }
[hidden] { display: none !important; }

.scene { position: relative; height: 100svh; min-height: 320px; isolation: isolate; overflow: hidden; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; touch-action: none; }
.vignette { position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(180deg, rgba(5, 8, 18, 0.5) 0%, transparent 18%, transparent 58%, rgba(5, 8, 18, 0.72) 100%); }
.chrome { transition: opacity 0.7s ease; }
body.quiet .chrome { opacity: 0; }
body.quiet .chrome:focus-within { opacity: 1; }
body.quiet .chip { display: none; }

.header { position: absolute; left: max(42px, env(safe-area-inset-left)); right: max(42px, env(safe-area-inset-right)); top: max(28px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; gap: 20px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 16px; letter-spacing: -0.35px; color: var(--ink); text-shadow: 0 1px 14px rgba(0, 0, 0, 0.6); text-decoration: none; }
.brand svg { width: 24px; height: 28px; stroke: var(--accent); fill: none; stroke-width: 1.15; }
.brand span { font-weight: 500; }
.top-actions { display: flex; align-items: center; gap: 10px; }
.top-action { border: 1px solid var(--line); border-radius: 999px; padding: 10px 15px; color: var(--ink); font-size: 12px; background: var(--glass); backdrop-filter: blur(12px); transition: background 0.25s; }
.top-action:hover { background: var(--soft); }
.top-action.icon { padding: 9px; display: grid; place-items: center; }
.top-action.icon svg { width: 16px; height: 16px; }
.mode-switch { position: absolute; top: max(25px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; padding: 4px; border: 1px solid var(--line); border-radius: 30px; background: var(--glass); backdrop-filter: blur(12px); }
.mode-switch button { padding: 10px 27px; min-height: 38px; border-radius: 25px; font-size: 13px; color: var(--muted); transition: background 0.35s, color 0.35s; }
.mode-switch button[aria-pressed="true"] { background: var(--soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

.intro { position: absolute; top: 17%; left: 20px; right: 20px; text-align: center; pointer-events: none; transition: opacity 0.9s ease, transform 0.9s ease; text-shadow: 0 1px 3px rgba(4, 6, 16, 0.55), 0 2px 26px rgba(4, 6, 16, 0.85); }
.intro::before { content: ""; position: absolute; left: 50%; top: 50%; width: min(1100px, 130%); height: 340px; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(8, 10, 22, 0.52), rgba(8, 10, 22, 0.28) 45%, transparent 72%); z-index: -1; }
body.playing .intro { opacity: 0; transform: translateY(-10px); }
.eyebrow { font-size: 10px; letter-spacing: 3.3px; color: var(--ink); text-transform: uppercase; margin: 0 0 17px; }
.intro h1 { font-family: var(--serif); font-size: clamp(34px, 4.3vw, 62px); font-weight: 400; letter-spacing: -1.4px; line-height: 1.15; margin: 0; }
.intro p:last-child { color: var(--ink); font-size: 13px; letter-spacing: 0.05px; margin: 15px 0 0; }

.dock-wrap { position: absolute; bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px)); left: 12px; right: 12px; display: flex; align-items: center; flex-direction: column; gap: 12px; }
#hud { display: flex; align-items: flex-end; justify-content: center; gap: clamp(18px, 4vw, 56px); text-shadow: 0 1px 16px rgba(4, 6, 16, 0.85); }
.gauge { text-align: center; min-width: 74px; }
.gauge .k { display: block; font-size: 9px; letter-spacing: 2.4px; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
.gauge .v { font-size: 22px; font-weight: 300; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; }
.gauge .v small { font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: 0.2px; margin-left: 3px; }
.gauge.hero .v { font-size: clamp(44px, 5vw, 66px); font-weight: 200; letter-spacing: -2px; line-height: 1; }
.gauge.hero .v small { display: none; }

#hit-strip { display: flex; gap: 12px; align-items: center; justify-content: center; }
.hitdot { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 9px; letter-spacing: 1.4px; color: var(--muted); }
.hitdot i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); opacity: 0.16; box-shadow: 0 0 calc(var(--l, 0) * 18px) var(--accent); }

.badges { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; align-items: center; }
.source-badge, .chip { display: inline-flex; gap: 8px; align-items: center; font-size: 11px; color: var(--ink); border: 1px solid var(--line); border-radius: 20px; background: rgba(20, 24, 40, 0.68); padding: 8px 12px; backdrop-filter: blur(8px); }
.chip { color: var(--muted); max-width: 46vw; }
.chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
.source-badge[data-source="live"] .dot, .chip[data-tone="good"] .dot { background: var(--good); box-shadow: 0 0 12px #bfe8a688; }
.source-badge[data-source="demo"] { border-color: #e6c7a366; background: rgba(66, 48, 28, 0.72); }
.source-badge[data-source="demo"] .dot { background: var(--demo); box-shadow: 0 0 10px #e6c7a388; }
.source-badge[data-source="replay"] .dot { background: #a8c6f4; }
.source-badge[data-source="open"] .dot, .chip[data-tone="warn"] .dot { background: var(--warn); }
.chip[data-tone="bad"] .dot { background: var(--bad); }
.chip[data-tone="wait"] .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.chip[data-tone="bad"] { color: #ffdcdc; border-color: rgba(244, 163, 163, 0.35); }
.chip[data-tone="good"] { color: var(--ink); }
.source-badge.keep { transition: none; }
body.quiet .keep-visible { opacity: 0.85; }
@keyframes pulse { 50% { opacity: 0.3; } }

.dock { display: flex; align-items: center; padding: 7px 9px; border: 1px solid var(--line); background: var(--glass); border-radius: 24px; box-shadow: 0 16px 60px var(--shadow); backdrop-filter: blur(24px); gap: 4px; }
.dock button { display: flex; align-items: center; flex-direction: column; gap: 7px; padding: 11px 19px 10px; border-radius: 17px; min-width: 74px; transition: background 0.2s; }
.dock button:hover, .dock button[aria-expanded="true"] { background: var(--soft); }
.dock button span { font-size: 10px; letter-spacing: 0.2px; color: var(--muted); }
.dock button.connected svg { color: var(--accent); }
.dock button.rec svg { color: var(--bad); }
.dock-divider { height: 30px; width: 1px; background: var(--line); margin: 0 5px; }
.truth { font-size: 10px; letter-spacing: 0.3px; color: var(--muted); text-align: center; margin: 0; max-width: 680px; line-height: 1.5; text-shadow: 0 1px 10px rgba(4, 6, 16, 0.9); }

.sheet:focus { outline: none; }
.sheet { color: var(--ink); background: var(--sheet); border: 1px solid var(--line); border-radius: 28px; padding: 30px; width: calc(100% - 32px); max-width: 480px; max-height: min(86svh, 780px); overflow-y: auto; box-shadow: 0 25px 100px #0005; }
.sheet.wide { max-width: 780px; }
.sheet::backdrop { background: #060c1690; backdrop-filter: blur(9px); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; gap: 16px; }
.sheet h2 { font-family: var(--serif); font-size: 30px; letter-spacing: -0.5px; font-weight: 400; margin: 0; }
.close { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); background: var(--soft); flex: none; }
.close svg { width: 17px; height: 17px; }
.sheet-intro { color: var(--muted); font-size: 13px; line-height: 1.65; margin: 12px 0 22px; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 9px 15px; font-size: 12px; background: var(--soft); color: var(--ink); white-space: nowrap; transition: background 0.2s, border-color 0.2s; }
.pill:hover:not(:disabled) { border-color: var(--accent); }
.pill.primary { background: var(--accent); color: #141627; border-color: transparent; font-weight: 500; }
.pill.wide { width: 100%; padding: 12px 15px; font-size: 13px; }
.pill.on { background: var(--accent); color: #141627; }
.device-card { display: flex; align-items: flex-start; gap: 14px; padding: 16px 0 12px; border-top: 1px solid var(--line); margin-top: 14px; }
.device-card svg.ic { width: 26px; height: 26px; fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; flex: none; margin-top: 2px; }
.device-info { flex: 1; min-width: 0; }
.device-info strong { font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.device-info strong .dot { display: inline-block; }
.device-info[data-tone="good"] strong .dot { background: var(--good); box-shadow: 0 0 10px #bfe8a688; }
.device-info[data-tone="warn"] strong .dot { background: var(--warn); }
.device-info[data-tone="bad"] strong .dot { background: var(--bad); }
.device-info[data-tone="wait"] strong .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.device-info .state { font-size: 12px; color: var(--ink); margin: 5px 0 0; font-weight: 500; }
.device-info .why { font-size: 12px; color: var(--muted); margin: 3px 0 0; line-height: 1.5; }
.controls-grid { display: grid; gap: 11px; padding: 0 0 8px 40px; }
.field { display: grid; gap: 5px; font-size: 11px; color: var(--muted); letter-spacing: 0.15px; }
.field .row { display: flex; justify-content: space-between; gap: 10px; }
.field b { font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; }
select { background: #111627; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; width: 100%; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) calc(var(--val, 50) * 1%), var(--line) calc(var(--val, 50) * 1%)); }
input[type="range"]::-moz-range-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) calc(var(--val, 50) * 1%), var(--line) calc(var(--val, 50) * 1%)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); margin-top: -5.5px; box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.25); }
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--ink); }
.meter { display: grid; gap: 3px; }
.meter div { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--good), var(--good) 70%, var(--warn) 88%, var(--bad)); }
pre.monitor { font-family: var(--mono); font-size: 11px; line-height: 1.55; color: var(--muted); background: #111627; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin: 0; min-height: 74px; white-space: pre-wrap; overflow: hidden; }
details { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
summary { font-size: 13px; cursor: pointer; color: var(--ink); padding: 3px 0; }
details > div, details > ol, details > p { font-size: 12px; color: var(--muted); line-height: 1.6; }
details ol { padding-left: 18px; margin: 10px 0 2px; }
details li { margin-bottom: 7px; }
.check { display: flex; gap: 9px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 14px; }
.padrow { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; align-items: center; padding: 5px 0; font-size: 12px; }
.padrow code { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.padrow .pill { padding: 5px 11px; font-size: 11px; }

.sig-canvas { width: 100%; display: block; border-radius: 12px; background: #0b0f1c; border: 1px solid var(--line); }
.sig-title { display: flex; justify-content: space-between; gap: 12px; font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); margin: 16px 0 7px; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 9px; margin-top: 14px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: rgba(184, 183, 255, 0.04); }
.stat .k { display: block; font-size: 9px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
.stat .v { font-size: 17px; font-weight: 300; font-variant-numeric: tabular-nums; }
.stat .n { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; }
table.maptable { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0 4px; }
table.maptable th, table.maptable td { text-align: left; padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--muted); font-weight: 400; }
table.maptable th { color: var(--ink); font-weight: 500; white-space: nowrap; }
.tag { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 10px 0; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
#toast { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); padding: 9px 15px; border-radius: 999px; font-size: 12px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); opacity: 0; pointer-events: none; transition: opacity 0.3s; max-width: 90vw; text-align: center; z-index: 5; }
#toast.show { opacity: 1; }
#gl-error { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); max-width: 460px; width: calc(100% - 40px); text-align: center; font-size: 14px; line-height: 1.6; color: var(--ink); background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 18px 22px; }

@media (max-width: 860px) {
  .header { left: 18px; right: 18px; top: max(14px, env(safe-area-inset-top)); }
  .mode-switch { top: max(62px, calc(env(safe-area-inset-top) + 48px)); }
  .mode-switch button { padding: 8px 24px; font-size: 12px; min-height: 34px; }
  .intro { top: 22%; }
  .eyebrow { font-size: 9px; letter-spacing: 2.6px; margin-bottom: 13px; }
  .intro h1 { font-size: 34px; letter-spacing: -1px; }
  .intro p:last-child { font-size: 12px; max-width: 280px; margin: 12px auto 0; line-height: 1.6; }
  .dock { padding: 5px; gap: 0; border-radius: 22px; }
  .dock button { padding: 10px 11px 9px; min-width: 62px; gap: 6px; }
  .dock button svg { width: 19px; height: 19px; }
  .dock-divider { margin: 0 2px; }
  .source-badge, .chip { font-size: 10px; padding: 7px 10px; }
  .truth { font-size: 10px; }
  #hud { gap: 12px; }
  .gauge { min-width: 62px; }
  .gauge .v { font-size: 18px; }
  .gauge.hero .v { font-size: 44px; }
  .sheet { padding: 24px; position: fixed; margin: auto auto 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; width: 100%; max-width: 560px; max-height: 88svh; padding-bottom: calc(26px + env(safe-area-inset-bottom)); }
  .sheet.wide { max-width: 100%; }
  .sheet h2 { font-size: 27px; }
  .controls-grid { padding-left: 0; }
}
@media (max-height: 640px) {
  .intro { display: none; }
  .truth { display: none; }
  #hit-strip { display: none; }
}
/* the narrowest phones: the brand gives way so the header's buttons stay on screen */
@media (max-width: 380px) {
  .header { gap: 10px; }
  .brand { gap: 8px; font-size: 14px; min-width: 0; }
  .brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top-action { padding: 9px 12px; }
}
/* phones held sideways and other short screens: everything on one screen, nothing pushed below the edge */
@media (max-height: 520px) {
  .header { top: max(8px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); }
  .top-action { padding: 7px 12px; }
  .top-action.icon { padding: 7px; }
  .mode-switch { top: max(8px, env(safe-area-inset-top)); }
  .mode-switch button { padding: 6px 16px; min-height: 30px; }
  .dock-wrap { bottom: max(6px, env(safe-area-inset-bottom)); gap: 5px; }
  #hud { gap: 14px; }
  .gauge { min-width: 54px; }
  .gauge .k { font-size: 8px; letter-spacing: 1.8px; margin-bottom: 2px; }
  .gauge .v { font-size: 15px; }
  .gauge.hero .v { font-size: 30px; }
  .dock { padding: 3px; border-radius: 18px; }
  .dock button { padding: 5px 10px 4px; gap: 2px; min-width: 52px; }
  .dock button svg { width: 16px; height: 16px; }
  .dock button span { font-size: 9px; }
  .dock-divider { height: 22px; }
  .source-badge, .chip { padding: 5px 9px; font-size: 10px; }
  #pedal { min-height: 30px; padding-top: 5px; padding-bottom: 5px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
}

/* the same-tab link among the three pages of the suite */
.family { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 4px; font-size: 10px; letter-spacing: 0.3px; }
.family a { color: var(--muted); text-decoration: none; padding: 7px 8px; border-radius: 12px; text-shadow: 0 1px 10px rgba(4, 6, 16, 0.9); transition: color 0.2s; }
.family a:hover { color: var(--ink); }
.family a[aria-current="page"] { color: var(--ink); }
@media (max-height: 640px) { .family { display: none; } }

/* Biofeedback Path Cockpit: what the shared shell does not already have */
.hud-set { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center; gap: 10px clamp(18px, 3.2vw, 46px); }
.gauge .k { display: flex; align-items: center; justify-content: center; gap: 6px; }
.hud-set.empty { display: none; }
.gauge .v.word { display: inline-block; font-size: 16px; line-height: 27px; text-transform: lowercase; }
.ep { display: inline-block; font-size: 8px; line-height: 1; letter-spacing: 0.9px; text-transform: uppercase; padding: 3px 5px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); font-weight: 500; vertical-align: 1px; white-space: nowrap; }
.ep-measured { color: var(--good); border-color: rgba(191, 232, 166, 0.35); }
.ep-inferred { color: #d6c7ff; border-color: rgba(214, 199, 255, 0.4); }
.ep-proxy { color: #9fe3e0; border-color: rgba(159, 227, 224, 0.4); }
.ep-demo { color: var(--demo); border-color: rgba(230, 199, 163, 0.45); }
.ep-proc { color: var(--muted); }

.source-badge[data-source="manual"] .dot { background: var(--accent); }
.quiet-pill { justify-self: start; background: transparent; }
#pedal { min-height: 40px; }
#pedal.on { background: var(--ink); }

.reading { position: absolute; left: 16px; right: 16px; top: 12.5%; text-align: center; pointer-events: none; text-shadow: 0 1px 3px rgba(4, 6, 16, 0.6), 0 2px 26px rgba(4, 6, 16, 0.85); }
.reading::before { content: ""; position: absolute; left: 50%; top: 48%; width: min(760px, 118%); height: 136%; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(8, 10, 22, 0.42), rgba(8, 10, 22, 0.24) 46%, transparent 72%); z-index: -1; }
.reading .eyebrow { margin-bottom: 12px; }
.read-num { font-size: clamp(64px, 8vw, 104px); font-weight: 200; letter-spacing: -3px; line-height: 1.02; font-variant-numeric: tabular-nums; }
.read-tier { font-size: 15px; margin: 8px 0 11px; }

<script>

(function (global) {

  const ICON = {
    connect: '<path d="M8 8v8M16 8v8M5 11v2M19 11v2M12 4v16"/>',
    session: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
    signal: '<path d="M3 12h3l2-6 4 13 3-9 2 4h4"/>',
    about: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
    route: '<path d="M6 21c0-5 4-5 6-9s2-6 1-9"/><path d="M18 21c0-4-2-5-3-8"/>',
    full: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
    close: '<path d="m6 6 12 12M18 6 6 18"/>',
    play: '<path d="M7 5v14l11-7z"/>',
    heart: '<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/><path d="M6.5 12.5h3l1.5-2.5 2 4 1.2-1.5h3.3"/>',
    crank: '<circle cx="7" cy="16" r="3.5"/><circle cx="17" cy="16" r="3.5"/><path d="m7 16 4-7h4l2 7M9 9h4M11 16l4-7"/>',

      <dialog class="sheet${s.wide ? ' wide' : ''}" id="${s.id}-sheet" aria-labelledby="${s.id}-title" tabindex="-1">

    const scene = $('scene');

      <div class="vignette"></div>
      <header class="header chrome">
        <a class="brand" href="index.html" aria-label="${esc(cfg.name)}: back to the home page">${cfg.brand}<span>${esc(cfg.name)}</span></a>
        <div class="top-actions">
          <button class="top-action" id="demo-button">Try a demo</button>

      ${cfg.modes ? `<nav class="mode-switch chrome" aria-label="${esc(cfg.modeLabel)}">${cfg.modes.map((m) => `<button data-mode="${m.id}" aria-pressed="${m.id === cfg.mode}">${esc(m.label)}</button>`).join('')}</nav>` : ''}

        <p class="eyebrow" id="intro-eyebrow"></p>
        <h1 id="intro-title"></h1>
        <p id="intro-sub"></p>
      </div>

      if (!modeButtons.some((b) => b.dataset.mode === m)) return;

    $('demo-button').addEventListener('click', () => cfg.toggleDemo());
    const fullscreen = () => { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => toast('Full screen is not available here.')); };
    $('fs-button').addEventListener('click', fullscreen);
    // A mouse click should not leave a button holding the keyboard, or Space would press it again.
    // Keyboard presses report detail 0, so keyboard users keep their focus.
    addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('button'); if (b && e.detail > 0 && !b.closest('dialog')) b.blur(); });

uniform sampler2D uScene,uPrev; uniform vec2 uVP; uniform float uZoom,uDream,uWild,uT;

      const skyHz = mix3('skyHz').map((v, i) => lerp(v, [0.1, 0.045, 0.11][i], dusk * 0.92));
      const fogBase = mix3('fog').map((v) => v * (1 - dusk * 0.86));
      const fogC = fogBase.map((v, i) => lerp(v, [0.17, 0.2, 0.28][i], haze * 0.8));
      const sunC = mix3('sun').map((v, i) => lerp(v, [0.26, 0.29, 0.44][i], night * 0.96 * (train ? 0.5 : 1)));
      const sunEl = train ? lerp(0.015, 0.2, S.dawn) : Math.max(0.035, mixN('sunEl') * (1 - dusk * 0.7));

      // Camera on the road. Watch looks up into the sky, Ride looks down the road, and Train sits between.
      const tall = cv.clientHeight > cv.clientWidth;
      S.tilt += ((watch ? (tall ? 0.3 : 0.36) : train ? (tall ? -0.1 : 0.16) : tall ? -0.04 : 0.02) - S.tilt) * Math.min(1, dtMs / 1100);
      const z = S.vis, cx = pathX(z), cy = roadY(z) + 1.55, look = 26;
      const tx = pathX(z + look), ty = roadY(z + look) + 1.0 + look * S.tilt;
      let fx = tx - cx, fy = ty - cy, fz = look;
      const fl = Math.hypot(fx, fy, fz); fx /= fl; fy /= fl; fz /= fl;
      const curveRoll = RM.matches ? 0 : clamp((pathX(z + 12) - 2 * pathX(z + 6) + cx) * 0.012, -0.07, 0.07);
      S.roll += (curveRoll - S.roll) * Math.min(1, dtMs / 200);
      let rx = fz, rz = -fx;
      const rl = Math.hypot(rx, rz); rx /= rl; rz /= rl;
      let ux = rz * fy, uy = rx * fz - rz * fx, uz = -rx * fy;
      if (uy < 0) { ux = -ux; uy = -uy; uz = -uz; }
      const cr = Math.cos(S.roll), sr = Math.sin(S.roll);
      const right = [rx * cr + ux * sr, uy * sr, rz * cr + uz * sr];
      const up = [ux * cr - rx * sr, uy * cr, uz * cr - rz * sr];
      const camX = cx, camY = cy + (RM.matches ? 0 : Math.sin(S.vis * 0.9) * 0.018 * motion01(S.rpm));
      const fwd = [fx, fy, fz];
      const sunAz = train ? Math.atan2(tx - cx, look) : mixN('sunAz');
      const sd = (() => { const x = Math.sin(sunAz), z2 = Math.cos(sunAz), y = sunEl, l = Math.hypot(x, y, z2); return [x / l, y / l, z2 / l]; })();
      const focal = 1.08, asp = rw / rh;

      for (let i = 0; i < 12; i++) {
        const r = rings[rings.length - 1 - i], o = i * 4;
        if (r) { ringData[o] = r.z; ringData[o + 1] = (now - r.t) / 1000; ringData[o + 2] = r.v; ringData[o + 3] = r.k; } else { ringData[o + 2] = 0; }
      }
      // The horizon is the last two minutes of heart rate, newest in the middle.
      let lo = 1e9, hi = 0;
      for (let i = 0; i < 64; i++) if (bio.hist[i] > 0) { lo = Math.min(lo, bio.hist[i]); hi = Math.max(hi, bio.hist[i]); }
      const span = Math.max(14, hi - lo);
      const ease = 1 - Math.exp(-dt / 1.1);
      for (let i = 0; i < 64; i++) {
        let sum = 0, w = 0;
        for (let k = -3; k <= 3; k++) { const v = bio.hist[clamp(i + k, 0, 63)]; if (v > 0) { const kw = 4 - Math.abs(k); sum += v * kw; w += kw; } }
        ridgeF[i] += ((w ? 0.07 + ((sum / w - lo) / span) * 0.26 : 0) - ridgeF[i]) * ease;
        ridge[i] = Math.round(clamp(ridgeF[i], 0, 1) * 255);
      }
      G.bindTex(1, tRidge);
      gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 64, 1, gl.RED, gl.UNSIGNED_BYTE, ridge);

      const beatLen = Math.max(6, (n.hr ? 60 / n.hr : 0.8) * Math.max(10, S.speed));
      const m = motion01(S.rpm);
      S.pulse *= Math.exp(-dt / 0.24);
      const br = bio.breath();
      const nebulaAmt = smooth(0.26, 0.72, dusk) * (ride ? 0.42 : train ? 0.32 * (1 - S.dawn) : 1);

      /* scene */
      gl.disable(gl.BLEND);
      G.into(scene);
      G.bindTex(0, tNoise); G.bindTex(1, tRidge);
      let ghostU = [0, 0, 0, 0];
      if (S.ghost) {
        const gd = ghostDistance(now);
        S.ghostGap = gd - S.dist;
        const gz = S.vis + S.ghostGap;
        ghostU = [pathX(gz), roadY(gz) + 1.15, gz, smooth(2, 12, S.ghostGap) * (1 - smooth(350, 620, S.ghostGap))];
      }
      G.use(pScene, {
        uN: 0, uS: 1, uRes: [rw, rh], uT: now / 1000, uFocal: focal, uBeat: beatLen, uSeed: S.seed,
        uCam: [camX, camY, z], uRight: right, uUp: up, uFwd: fwd,
        uSkyTop: skyTop, uSkyHz: skyHz, uSunC: sunC, uGround: mix3('ground'), uRock: mix3('rock'), uFog: fogC, uEdge: mix3('edge'), uSunDir: sd,
        uAmp: mixN('amp'), uRidge: mixN('ridge'), uSea: mixN('sea'), uSnow: mixN('snow'), uStrata: mixN('strata'), uGrid: mixN('grid'), uTrees: mixN('trees'), uDusk: dusk, uFogK: mixN('fogK') * (1 + haze * 7),
        uSpark: 0.12, uShimmer: 0.1, uAurora: S.load * S.load * 0.26,
        uRing: ringData,
        uHaze: haze, uWeather: S.load, uWarm: smooth(0.16, 0.74, S.load), uBreath: br.ee, uBreathOn: train ? 1 : 0, uNebula: nebulaAmt, uGhost: ghostU,
      });
      G.draw();

      /* motes */
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
      G.use(pMote, { uCam: [camX, camY, z], uRight: right, uUp: up, uFwd: fwd, uFocal: focal, uAsp: asp, uZ: z, uPx: rh * 0.09, uSeed: S.seed, uSpark: 0.12 + S.pulse * 0.1, uShimmer: 0.1, uSpeedN: m, uEdge: mix3('edge') });
      gl.drawArrays(gl.POINTS, 0, 1500);
      gl.disable(gl.BLEND);

      /* feedback */
      const vpP = [pathX(z + 90) - camX, roadY(z + 90) + 1 - camY, 90];
      const cz = vpP[0] * fwd[0] + vpP[1] * fwd[1] + vpP[2] * fwd[2];
      const vp = [0.5 + ((vpP[0] * right[0] + vpP[1] * right[1] + vpP[2] * right[2]) * focal) / cz / asp / 2, 0.5 + ((vpP[0] * up[0] + vpP[1] * up[1] + vpP[2] * up[2]) * focal) / cz / 2];
      const fpsScale = dtMs / 16.67;
      const zoomNow = RM.matches ? S.zoom * 0.4 : 1 - Math.pow(1 - (S.zoom + 0.0012), fpsScale);
      const wildEff = train ? S.wild * (1 - S.clarity) : clamp(S.wild + S.load * AROUSAL_WILD, 0, 1);
      G.into(dreamB);
      G.bindTex(0, scene.tex); G.bindTex(1, dreamA.tex);
      G.use(pDream, { uScene: 0, uPrev: 1, uVP: vp, uZoom: zoomNow, uDream: RM.matches ? S.dream * 0.5 : S.dream, uWild: wildEff, uT: now / 1000 });
      G.draw();
      const tmp = dreamA; dreamA = dreamB; dreamB = tmp;

      /* bloom and grade */
      const bloom = Post.bloom(dreamA.tex, 1.15);
      Post.finish(dreamA.tex, bloom, {
        uBloomK: 0.55 + S.load * 0.18, uExposure: 0.98 + dusk * 0.25 + S.pulse * 0.012, uFlash: 0, uFlashC: [1, 0.93, 0.82], uGrain: 0.022, uT: now / 1000, uVig: 0.55, uSat: 1.06, rate: RM.matches ? 0.16 : 0.36,
      }, dt);

      /* the dotted orbit, over the finished picture */
      const scale = Math.min(1, asp * 1.15);
      let sunNdc = [0, 0];
      { const d = sd[0] * fwd[0] + sd[1] * fwd[1] + sd[2] * fwd[2]; if (d > 0.05) sunNdc = [((sd[0] * right[0] + sd[1] * right[1] + sd[2] * right[2]) * focal) / d / asp, ((sd[0] * up[0] + sd[1] * up[1] + sd[2] * up[2]) * focal) / d]; }
      const cT = train ? [sunNdc[0], sunNdc[1]] : [0, asp < 1 ? 0.3 : 0.27];
      S.orbitC = S.orbitC.map((v, i) => lerp(v, cT[i], Math.min(1, dtMs / 500)));
      const aT = ride ? 0 : train ? 0.95 : (bio.demoOn || bio.replayOn || bio.hr.connected ? 0.85 : 0.42);
      S.orbitA += (aT - S.orbitA) * Math.min(1, dtMs / 500);
      if (S.orbitA > 0.01) {
        const R = train ? lerp(0.2, 0.37, br.ee) * scale : 0.6 * scale;
        G.into(null);
        gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
        G.use(pOrbit, { uC: S.orbitC, uR: R, uAsp: asp, uT: now / 1000, uA: S.orbitA, uPx: Math.max(1.5, (cv.height / 900) * 2.1), uSquash: train ? 1 : 0.8 });
        gl.drawArrays(gl.POINTS, 0, train ? 620 : 900);
        gl.disable(gl.BLEND);
      }
      // The cue sits inside the breathing ring, wherever the sun has drifted to.
      if (train) { const bx = (S.orbitC[0] * 0.5 + 0.5) * cv.clientWidth, by = (0.5 - S.orbitC[1] * 0.5) * cv.clientHeight; $('breath').style.transform = `translate(${bx.toFixed(1)}px, ${by.toFixed(1)}px)`; $('breath').classList.toggle('on-light', S.dawn > 0.42); }

      if (lumaRec) lumaRec(now);
      if (wantSnap) { const done = wantSnap; wantSnap = null; cv.toBlob((blob) => done(blob), 'image/png'); }
    } catch (e) {
      if (fails++ < 3) console.error(e);
    }
  }

  /* ---- boot ---- */
  shell.setMode(S.mode);
  renderReading(); renderHud();
  if (!G) {
    shell.glFail('This page draws with WebGL2, which this browser did not provide. The sensors below still report their state.');
    const idle = (now) => { requestAnimationFrame(idle); bio.tick(now); if (now - lastText > 120) { lastText = now; renderStates(); renderReading(); renderHud(); if ($('signal-sheet').open) { renderSignal(); drawSignal(); } } };
    requestAnimationFrame(idle);
  } else {
    gl = G.gl;
    try {
      Post = createPost(G);
      pScene = G.program(SCENE_FS);
      pDream = G.program(DREAM_FS);
      pMote = G.program(MOTE_FS, MOTE_VS);
      pOrbit = G.program(ORBIT_FS, ORBIT_VS);
      tNoise = G.noiseTexture(20261102);
      tRidge = G.tex(64, 1, { internal: gl.R8, format: gl.RED, type: gl.UNSIGNED_BYTE });
      resize();
      addEventListener('resize', resize);
      cv.addEventListener('webglcontextlost', (e) => { e.preventDefault(); shell.glFail('The graphics context was lost. Reload the page to get the picture back.'); });
      requestAnimationFrame(render);
    } catch (e) {
      console.error(e);
      shell.glFail(`The picture could not start on this graphics card: ${String(e.message).slice(0, 140)}`);
    }
  }

  // For the flicker check: the picture's brightness on a small grid, every frame, straight after it is drawn.
  let lumaRec = null;
  function recordLuma(ms) {
    const c = document.createElement('canvas'); c.width = 64; c.height = 36;
    const g = c.getContext('2d', { willReadFrequently: true }), frames = [], t0 = performance.now();
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    return new Promise((res) => {
      lumaRec = (now) => {
        g.drawImage(cv, 0, 0, 64, 36);
        const d = g.getImageData(0, 0, 64, 36).data, grid = [];
        for (let i = 0; i < d.length; i += 4) grid.push(+(0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]).toFixed(1));
        frames.push({ t: +(now - t0).toFixed(1), grid });
        if (now - t0 > ms) { lumaRec = null; res(frames); }
      };
    });
  }

  /* for the checks: read what is really on the canvas and in the engine */
  window.__app = {
    S, bio, BioMath, BIOMES, pathX, roadY, gradeAt, gradeFactor, motion01, CLARITY_TARGET, recordLuma,
    pixel() {
      const c = document.createElement('canvas'); c.width = 32; c.height = 18;
      const g = c.getContext('2d');
      return new Promise((res) => { wantSnap = (blob) => { const im = new Image(); im.onload = () => { g.drawImage(im, 0, 0, 32, 18); const d = g.getImageData(0, 0, 32, 18).data; let sum = 0, min = 1e9, max = 0; const grid = []; for (let i = 0; i < d.length; i += 4) { const l = d[i] * 0.2126 + d[i + 1] * 0.7152 + d[i + 2] * 0.0722; sum += l; min = Math.min(min, l); max = Math.max(max, l); grid.push(l); } res({ mean: sum / (d.length / 4), min, max, grid }); }; im.src = URL.createObjectURL(blob); }; });
    },
  };
})();

</script>
</body>
</html>
