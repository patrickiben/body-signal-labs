<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101525">
<title>Biofeedback Path Cockpit</title>
<meta name="description" content="Nine cycling scenes whose weather, grade and fog follow your body, with cadence-powered riding or an optional Muse S Athena EEG balance game control. Not a medical device.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101525'/%3E%3Cpath d='M5 17h6l2.5-6 4 11 2.5-5H27' fill='none' stroke='%23b8b7ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --bg: #101525;
  --ink: #eeedfb;
  --muted: #b6b9cf;
  --faint: #8d93ad;
  --accent: #b8b7ff;
  --line: rgba(191, 194, 236, 0.17);
  --glass: rgba(24, 28, 46, 0.72);
  --sheet: #1a2032;
  --soft: rgba(184, 183, 255, 0.1);
  --shadow: rgba(2, 6, 19, 0.45);
  --good: #bfe8a6;
  --warn: #f1cf8e;
  --bad: #f4a3a3;
  --demo: #e6c7a3;
  --serif: var(--sans);   /* headings use the interface sans-serif; the serif read like an essay */
  --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 400; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; }
button, a, input, select { touch-action: manipulation; }
button { color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
a { color: var(--accent); }
[hidden] { display: none !important; }

.scene { position: relative; height: 100svh; min-height: 320px; isolation: isolate; overflow: hidden; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; touch-action: none; }
.vignette { position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(180deg, rgba(5, 8, 18, 0.56) 0%, rgba(5, 8, 18, 0.16) 14%, transparent 28%, transparent 56%, rgba(5, 8, 18, 0.78) 100%); }
.chrome { transition: opacity 0.7s ease; }
body.quiet .chrome { opacity: 0; }
body.quiet .chrome:focus-within { opacity: 1; }
body.quiet .chip { display: none; }
/* Zen leaves the scenery, the readouts and the pedal button; every other control goes and cannot be tapped by accident. */
body.zen .header, body.zen .scenebar, body.zen .dock, body.zen .intro, body.zen .chip, body.zen .suite-bar,
body.zen .mode-switch, body.zen .truth, body.zen .family, body.zen .ride-power {
  opacity: 0 !important;
  pointer-events: none !important;
  transition: opacity 0.5s ease;
}
body.zen #hud {
  opacity: 0.95;
  transition: opacity 0.5s ease;
}

.header { position: absolute; left: max(42px, env(safe-area-inset-left)); right: max(42px, env(safe-area-inset-right)); top: max(28px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; gap: 20px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 16px; letter-spacing: -0.35px; color: var(--ink); text-shadow: 0 1px 14px rgba(0, 0, 0, 0.6); text-decoration: none; transition: opacity 0.2s ease; }
.brand:hover { opacity: 0.88; }
.brand svg { width: 24px; height: 28px; stroke: var(--accent); fill: none; stroke-width: 1.15; filter: drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 35%, transparent)); }
.brand span { font-weight: 500; }
.top-actions { display: flex; align-items: center; gap: 10px; }
.top-action { border: 1px solid var(--line); border-radius: 999px; padding: 10px 15px; color: var(--ink); font-size: 12px; background: var(--glass); backdrop-filter: blur(16px) saturate(135%); -webkit-backdrop-filter: blur(16px) saturate(135%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 8px 24px rgba(2, 6, 19, 0.35); transition: background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease; }
.top-action:hover { background: var(--soft); border-color: color-mix(in srgb, var(--accent) 42%, var(--line)); }
.top-action.icon { padding: 9px; display: grid; place-items: center; }
.top-action.icon svg { width: 16px; height: 16px; }
.mode-switch { position: absolute; top: max(25px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; padding: 4px; border: 1px solid var(--line); border-radius: 30px; background: var(--glass); backdrop-filter: blur(16px) saturate(135%); -webkit-backdrop-filter: blur(16px) saturate(135%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 10px 28px rgba(2, 6, 19, 0.38); }
.mode-switch button { padding: 10px 27px; min-height: 38px; border-radius: 25px; font-size: 13px; color: var(--muted); transition: background 0.28s ease, color 0.28s ease, box-shadow 0.28s ease; }
.mode-switch button:hover { color: var(--ink); }
.mode-switch button[aria-pressed="true"] { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 24%, rgba(255, 255, 255, 0.12)), color-mix(in srgb, var(--accent) 12%, rgba(255, 255, 255, 0.04))); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), inset 0 0 0 1px color-mix(in srgb, var(--accent) 32%, var(--line)), 0 2px 10px rgba(2, 6, 19, 0.35); }

.intro { position: absolute; top: 17%; left: 20px; right: 20px; text-align: center; pointer-events: none; transition: opacity 0.9s ease, transform 0.9s ease; text-shadow: 0 1px 3px rgba(4, 6, 16, 0.55), 0 2px 26px rgba(4, 6, 16, 0.85); }
.intro::before { content: ""; position: absolute; left: 50%; top: 50%; width: min(1100px, 130%); height: 340px; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(8, 10, 22, 0.52), rgba(8, 10, 22, 0.28) 45%, transparent 72%); z-index: -1; }
body.playing .intro { opacity: 0; transform: translateY(-10px); }
.eyebrow { font-size: 10px; letter-spacing: 3.3px; color: var(--ink); text-transform: uppercase; margin: 0 0 17px; }
.intro h1 { font-family: var(--serif); font-size: clamp(34px, 4.3vw, 62px); font-weight: 400; letter-spacing: -1.4px; line-height: 1.15; margin: 0; }
.intro p:last-child { color: var(--ink); font-size: 13px; letter-spacing: 0.05px; margin: 15px 0 0; }

.dock-wrap { position: absolute; bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px)); left: 12px; right: 12px; display: flex; align-items: center; flex-direction: column; gap: 12px; }
#hud { display: flex; align-items: flex-end; justify-content: center; gap: clamp(18px, 4vw, 56px); text-shadow: 0 1px 16px rgba(4, 6, 16, 0.85); }
.gauge { text-align: center; min-width: 74px; }
.gauge .k { display: block; font-size: 9px; letter-spacing: 2.4px; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
.gauge .v { font-size: 22px; font-weight: 300; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; }
.gauge .v small { font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: 0.2px; margin-left: 3px; }
.gauge.hero .v { font-size: clamp(44px, 5vw, 66px); font-weight: 200; letter-spacing: -2px; line-height: 1; }
.gauge.hero .v small { display: none; }

#hit-strip { display: flex; gap: 12px; align-items: center; justify-content: center; }
.hitdot { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 9px; letter-spacing: 1.4px; color: var(--muted); }
.hitdot i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); opacity: 0.16; box-shadow: 0 0 calc(var(--l, 0) * 18px) var(--accent); }

.badges { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; align-items: center; }
.source-badge, .chip { display: inline-flex; gap: 8px; align-items: center; font-size: 11px; color: var(--ink); border: 1px solid var(--line); border-radius: 20px; background: rgba(18, 22, 38, 0.72); padding: 8px 12px; backdrop-filter: blur(12px) saturate(130%); -webkit-backdrop-filter: blur(12px) saturate(130%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 4px 14px rgba(2, 6, 19, 0.3); transition: border-color 0.2s ease, background 0.2s ease; }
.source-badge:hover, .chip:hover { border-color: color-mix(in srgb, var(--accent) 38%, var(--line)); background: rgba(26, 31, 52, 0.8); }
.chip { color: var(--muted); max-width: 46vw; }
.chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
.source-badge[data-source="live"] .dot, .chip[data-tone="good"] .dot { background: var(--good); box-shadow: 0 0 12px #bfe8a688; }
.source-badge[data-source="demo"] { border-color: #e6c7a366; background: rgba(66, 48, 28, 0.72); }
.source-badge[data-source="demo"] .dot { background: var(--demo); box-shadow: 0 0 10px #e6c7a388; }
.source-badge[data-source="replay"] .dot { background: #a8c6f4; }
.source-badge[data-source="open"] .dot, .chip[data-tone="warn"] .dot { background: var(--warn); }
.chip[data-tone="bad"] .dot { background: var(--bad); }
.chip[data-tone="wait"] .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.chip[data-tone="bad"] { color: #ffdcdc; border-color: rgba(244, 163, 163, 0.35); }
.chip[data-tone="good"] { color: var(--ink); }
.source-badge.keep { transition: none; }
body.quiet .keep-visible { opacity: 0.85; }
@keyframes pulse { 50% { opacity: 0.3; } }

.dock { display: flex; align-items: center; padding: 7px 9px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(28, 33, 54, 0.78), rgba(18, 22, 38, 0.84)); border-radius: 24px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.13), 0 16px 60px var(--shadow); backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%); gap: 4px; }
.dock button { display: flex; align-items: center; flex-direction: column; gap: 7px; padding: 11px 19px 10px; border-radius: 17px; min-width: 74px; transition: background 0.2s ease, color 0.2s ease; }
.dock button svg { transition: transform 0.2s ease, color 0.2s ease; }
.dock button:hover, .dock button[aria-expanded="true"] { background: var(--soft); }
.dock button:hover svg { transform: translateY(-1.5px); color: var(--accent); }
.dock button:hover span, .dock button[aria-expanded="true"] span { color: var(--ink); }
.dock button span { font-size: 10px; letter-spacing: 0.2px; color: var(--muted); transition: color 0.2s ease; }
.dock button.connected svg { color: var(--accent); }
.dock button.rec svg { color: var(--bad); }
.dock-divider { height: 30px; width: 1px; background: var(--line); margin: 0 5px; }
.truth { font-size: 10px; letter-spacing: 0.3px; color: var(--muted); text-align: center; margin: 0; max-width: 680px; line-height: 1.5; text-shadow: 0 1px 10px rgba(4, 6, 16, 0.9); }

.sheet:focus { outline: none; }
.sheet { color: var(--ink); background: linear-gradient(165deg, #1f263c 0%, #151a2b 100%); border: 1px solid var(--line); border-radius: 28px; padding: 30px; width: calc(100% - 32px); max-width: 480px; max-height: min(86svh, 780px); overflow-y: auto; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 28px 100px rgba(0, 0, 0, 0.65); }
.sheet.wide { max-width: 780px; }
.sheet::backdrop { background: #060c1690; backdrop-filter: blur(9px); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; gap: 16px; }
.sheet h2 { font-family: var(--serif); font-size: 30px; letter-spacing: -0.5px; font-weight: 400; margin: 0; }
.close { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); background: var(--soft); flex: none; transition: background 0.2s ease, color 0.2s ease; }
.close:hover { color: var(--ink); background: rgba(184, 183, 255, 0.2); }
.close svg { width: 17px; height: 17px; }
.sheet-intro { color: var(--muted); font-size: 13px; line-height: 1.65; margin: 12px 0 22px; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 9px 15px; font-size: 12px; background: var(--soft); color: var(--ink); white-space: nowrap; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08); transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease; }
.pill:hover:not(:disabled) { border-color: var(--accent); }
.pill.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 92%, #fff), var(--accent)); color: #121526; border-color: transparent; font-weight: 500; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 6px 20px color-mix(in srgb, var(--accent) 30%, rgba(2, 6, 19, 0.45)); }
.pill.primary:hover:not(:disabled) { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 8px 24px color-mix(in srgb, var(--accent) 45%, rgba(2, 6, 19, 0.55)); }
.pill.wide { width: 100%; padding: 12px 15px; font-size: 13px; }
.pill.on { background: var(--accent); color: #141627; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 32%, transparent), 0 0 22px color-mix(in srgb, var(--accent) 55%, transparent); }
.device-card { display: flex; align-items: flex-start; gap: 14px; padding: 16px 0 12px; border-top: 1px solid var(--line); margin-top: 14px; }
.device-card svg.ic { width: 26px; height: 26px; fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; flex: none; margin-top: 2px; }
.device-info { flex: 1; min-width: 0; }
.device-info strong { font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.device-info strong .dot { display: inline-block; }
.device-info[data-tone="good"] strong .dot { background: var(--good); box-shadow: 0 0 10px #bfe8a688; }
.device-info[data-tone="warn"] strong .dot { background: var(--warn); }
.device-info[data-tone="bad"] strong .dot { background: var(--bad); }
.device-info[data-tone="wait"] strong .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.device-info .state { font-size: 12px; color: var(--ink); margin: 5px 0 0; font-weight: 500; }
.device-info .why { font-size: 12px; color: var(--muted); margin: 3px 0 0; line-height: 1.5; }
.controls-grid { display: grid; gap: 11px; padding: 0 0 8px 40px; }
.field { display: grid; gap: 5px; font-size: 11px; color: var(--muted); letter-spacing: 0.15px; }
.field .row { display: flex; justify-content: space-between; gap: 10px; }
.field b { font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; }
select { background: #111627; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; width: 100%; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) calc(var(--val, 50) * 1%), var(--line) calc(var(--val, 50) * 1%)); }
input[type="range"]::-moz-range-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) calc(var(--val, 50) * 1%), var(--line) calc(var(--val, 50) * 1%)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); margin-top: -5.5px; box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.25), 0 0 10px color-mix(in srgb, var(--accent) 40%, transparent); transition: transform 0.15s ease; }
input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.15); }
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--ink); }
.meter { display: grid; gap: 3px; }
.meter div { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--good), var(--good) 70%, var(--warn) 88%, var(--bad)); }
pre.monitor { font-family: var(--mono); font-size: 11px; line-height: 1.55; color: var(--muted); background: #111627; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin: 0; min-height: 74px; white-space: pre-wrap; overflow: hidden; }
details { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
summary { font-size: 13px; cursor: pointer; color: var(--ink); padding: 3px 0; }
details > div, details > ol, details > p { font-size: 12px; color: var(--muted); line-height: 1.6; }
details ol { padding-left: 18px; margin: 10px 0 2px; }
details li { margin-bottom: 7px; }
.check { display: flex; gap: 9px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 14px; }
.padrow { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; align-items: center; padding: 5px 0; font-size: 12px; }
.padrow code { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.padrow .pill { padding: 5px 11px; font-size: 11px; }

.sig-canvas { width: 100%; display: block; border-radius: 12px; background: #0b0f1c; border: 1px solid var(--line); }
.sig-title { display: flex; justify-content: space-between; gap: 12px; font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); margin: 16px 0 7px; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 9px; margin-top: 14px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: rgba(184, 183, 255, 0.04); }
.stat .k { display: block; font-size: 9px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
.stat .v { font-size: 17px; font-weight: 300; font-variant-numeric: tabular-nums; }
.stat .n { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; }
table.maptable { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0 4px; }
table.maptable th, table.maptable td { text-align: left; padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--muted); font-weight: 400; }
table.maptable th { color: var(--ink); font-weight: 500; white-space: nowrap; }
.tag { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 10px 0; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
#toast { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); padding: 9px 15px; border-radius: 999px; font-size: 12px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); opacity: 0; pointer-events: none; transition: opacity 0.3s; max-width: 90vw; text-align: center; z-index: 5; }
#toast.show { opacity: 1; }
#gl-error { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); max-width: 460px; width: calc(100% - 40px); text-align: center; font-size: 14px; line-height: 1.6; color: var(--ink); background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 18px 22px; }

@media (max-width: 860px) {
  .header { left: 18px; right: 18px; top: max(14px, env(safe-area-inset-top)); }
  .mode-switch { top: max(62px, calc(env(safe-area-inset-top) + 48px)); }
  .mode-switch button { padding: 8px 24px; font-size: 12px; min-height: 34px; }
  .intro { top: 22%; }
  .eyebrow { font-size: 9px; letter-spacing: 2.6px; margin-bottom: 13px; }
  .intro h1 { font-size: 34px; letter-spacing: -1px; }
  .intro p:last-child { font-size: 12px; max-width: 280px; margin: 12px auto 0; line-height: 1.6; }
  .dock { padding: 5px; gap: 0; border-radius: 22px; }
  .dock button { padding: 10px 11px 9px; min-width: 62px; gap: 6px; }
  .dock button svg { width: 19px; height: 19px; }
  .dock-divider { margin: 0 2px; }
  .source-badge, .chip { font-size: 10px; padding: 7px 10px; }
  .truth { font-size: 10px; }
  #hud { gap: 12px; }
  .gauge { min-width: 62px; }
  .gauge .v { font-size: 18px; }
  .gauge.hero .v { font-size: 44px; }
  .sheet { padding: 24px; position: fixed; margin: auto auto 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; width: 100%; max-width: 560px; max-height: 88svh; padding-bottom: calc(26px + env(safe-area-inset-bottom)); }
  .sheet.wide { max-width: 100%; }
  .sheet h2 { font-size: 27px; }
  .controls-grid { padding-left: 0; }
}
@media (max-height: 640px) {
  .intro { display: none; }
  .truth { display: none; }
  #hit-strip { display: none; }
}
/* the narrowest phones: the brand gives way so the header's buttons stay on screen */
@media (max-width: 380px) {
  .header { gap: 10px; }
  .brand { gap: 8px; font-size: 14px; min-width: 0; }
  .brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top-action { padding: 9px 12px; }
}
/* phones held sideways and other short screens: everything on one screen, nothing pushed below the edge */
@media (max-height: 520px) {
  .header { top: max(8px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); }
  .top-action { padding: 7px 12px; }

  // Ferns and colorful cordyline-like leaves grow in layered clumps.
  if(h<.78)for(int f=0;f<7;f++){
    float a=(float(f)-3.)*.4;
    vec2 base=vec2(-.75,0.),tip=base+vec2(sin(a)*1.45,cos(a)*(1.25+.25*h));
    float leaf=leaf2(p,base,tip,.2);
    float t=dot(p-base,tip-base)/dot(tip-base,tip-base);
    float phaseAA=foliageAA*27./length(tip-base);
    float resolved=1.-smoothstep(.35,1.4,phaseAA);
    leaf*=mix(.85879,smoothstep(.22-phaseAA,.22+phaseAA,abs(sin(t*27.))),resolved);
    if(leaf>.001)foliagePaint(c,alpha,mix(vec3(.045,.22,.085),vec3(.15,.36,.105),float(f)/7.),leaf);
  }
  // Broad heart-shaped monstera / elephant-ear understory leaves with fenestration notches
  if(h>.32&&h<.82)for(int m=0;m<3;m++){
    float mx=-.15+float(m)*.38,my=.38+float(m)*.16;
    vec2 mBase=vec2(mx,0.),mTip=vec2(mx+(float(m)-1.)*.26,my+.62);
    float stemM=foliageBand(line2(p,mBase,mTip),.016,foliageAA);
    if(stemM>.001)foliagePaint(c,alpha,vec3(.07,.24,.07),stemM);
    float mLeaf=leaf2(p,mBase+vec2(0.,.18),mTip,.34);
    if(mLeaf>.001){
      float notch=smoothstep(.04,.09,abs(sin((p.y-my)*16.))+abs(p.x-mx)*1.8);
      float vein=1.-smoothstep(.01,.035,line2(p,mBase+vec2(0.,.18),mTip));
      foliagePaint(c,alpha,mix(vec3(.04,.20,.07),vec3(.13,.33,.10),float(m)*.4)+vec3(.05,.08,.02)*vein,mLeaf*mix(.85,1.,notch));
    }
  }
  if(h>.2&&h<.72)for(int f=0;f<5;f++){
    vec2 base=vec2(.7,0.),tip=base+vec2((float(f)-2.)*.42,1.1+.3*sin(float(f)+h));
    float leaf=leaf2(p,base,tip,.22);
    if(leaf>.001)foliagePaint(c,alpha,mix(vec3(.28,.055,.095),vec3(.48,.14,.18),float(f)/5.),leaf);
  }
  if(h<.3){
    // Upright heliconia stems with alternating boat-shaped orange/red bracts.
    for(int stem=0;stem<2;stem++){
      float sx=-.13+float(stem)*.48,top=1.45+float(stem)*.3;
      if(line2(p,vec2(sx,.05),vec2(sx,top))<.025){alpha=1.;c=vec3(.08,.23,.065);}
      for(int k=0;k<4;k++){
        float sideK=mod(float(k+stem),2.)*2.-1.,by=.55+float(k)*.23+float(stem)*.1;
        vec2 base=vec2(sx,by),tip=base+vec2(sideK*.5,.21);
        if(leaf2(p,base,tip,.13)>.5){alpha=1.;c=mix(vec3(.65,.055,.03),vec3(.95,.27,.035),float(k)/4.);}
      }
    }
  }else if(h>.62&&h<.9){
    // Recognizable five-petalled flowers in pink and purple roadside clusters.
    for(int fl=0;fl<5;fl++){
      vec2 center=vec2((float(fl)-2.)*.28,.65+.42*sin(float(fl)*1.4+h));
      if(line2(p,vec2(center.x*.7,0.),center)<.018){alpha=1.;c=vec3(.05,.2,.055);}
      for(int petal=0;petal<5;petal++){
        float a=float(petal)*1.2566;vec2 d=p-center-vec2(sin(a),cos(a))*.105;
        if(length(d/vec2(.095,.095))<1.){alpha=1.;c=mix(vec3(.47,.07,.31),vec3(.68,.19,.44),h);}
      }
      if(length(p-center)<.04){alpha=1.;c=vec3(.95,.63,.11);}
    }
  }
  // Iridescent Blue Morpho butterfly resting on sunlit foliage
  if(sight>.42&&sight<.54){
    vec2 bp=p-vec2(-.28,1.18+.15*sin(h*19.));
    vec2 wL=vec2(abs(bp.x),bp.y);
    float fore=1.-smoothstep(.88,1.+foliageAA*4.,length((wL-vec2(.13,.06))/vec2(.15,.11)));
    float hind=1.-smoothstep(.88,1.+foliageAA*4.,length((wL-vec2(.10,-.05))/vec2(.12,.09)));
    float wing=max(fore,hind);
    if(wing>.001){
      float rim=smoothstep(.10,.15,length(wL-vec2(.11,.01)));
      vec3 morpho=mix(vec3(.07,.52,.96),vec3(.02,.04,.06),rim);
      foliagePaint(c,alpha,morpho,wing);
    }
  }
  // Occasional toucan-like bird, resting on a woody branch above the flowers.
  if(sight<.055){
    vec2 perch=vec2(.25,1.9);
    if(line2(p,vec2(.8,.1),perch+vec2(.35,-.08))<.045||line2(p,perch-vec2(.1,.1),perch+vec2(.55,-.1))<.035){alpha=1.;c=vec3(.22,.13,.07);}
    vec2 q=p-perch;
    float bird=step(length((q-vec2(0.,.22))/vec2(.24,.3)),1.);
    bird=max(bird,leaf2(q,vec2(-.04,.08),vec2(-.34,-.28),.085));
    if(bird>.5){alpha=1.;c=vec3(.025,.055,.085);}
    if(length((q-vec2(.12,.47))/vec2(.16,.17))<1.){alpha=1.;c=vec3(.035,.07,.08);}
    if(length((q-vec2(.1,.3))/vec2(.1,.13))<1.){alpha=1.;c=vec3(.9,.72,.23);}
    if(leaf2(q,vec2(.2,.5),vec2(.68,.42),.13)>.5){alpha=1.;c=vec3(.94,.36,.035);}
    if(length(q-vec2(.17,.5))<.025){alpha=1.;c=vec3(.005);}
  }
  // A small lizard rests on a low rock, off the riding surface.
  if(sight>.94){
    vec2 q=p-vec2(.2,.24);
    if(length((p-vec2(.15,.09))/vec2(.72,.22))<1.){alpha=1.;c=vec3(.26,.23,.17);}
    float liz=step(length(q/vec2(.27,.09)),1.);
    liz=max(liz,step(length((q-vec2(.29,.03))/vec2(.1,.075)),1.));
    float tailY=.04*sin((q.x+.27)*7.);
    liz=max(liz,step(-.85,q.x)*step(q.x,-.18)*step(abs(q.y-tailY),.035*(q.x+.9)/.72));
    for(int leg=0;leg<4;leg++){
      float sideL=mod(float(leg),2.)*2.-1.,lx=leg<2?-.13:.14;
      liz=max(liz,step(line2(q,vec2(lx,0.),vec2(lx-.08,sideL*.19)),.025));
    }
    if(liz>.5){alpha=1.;c=vec3(.15,.27,.08)*(1.+.18*sin(q.x*31.));}
  }
  return vec4(c,alpha);
}

// Small, non-emissive roadside details. p is metres from a roadside ground point:
// x across the path, y up. h is the existing stable per-row random number in [0,1].
// Call AFTER the row's depth/terrain rejection, only within abs(p.x)<1.5 and -.16<p.y<1.35.
// Returns straight RGB + coverage; multiply RGB by the scene's existing lighting/fog.
// Fixed upper bound: three stems, five petals each, one small animal. No texture reads.
float epHash(float v){return fract(sin(v*127.13+3.7)*43758.5453);}
float epCross(vec2 a,vec2 b){return a.x*b.y-a.y*b.x;}
float epLine(vec2 p,vec2 a,vec2 b,float width,float aa){
  vec2 ab=b-a;float q=clamp(dot(p-a,ab)/max(dot(ab,ab),.00001),0.,1.);
  return foliageBand(length(p-a-ab*q),width,aa);
}
float epOval(vec2 p,vec2 r,float aa){
  float d=(length(p/r)-1.)*min(r.x,r.y);
  return (1.-smoothstep(-aa,aa,d))*min(1.,min(r.x,r.y)/aa);
}
float epTriangle(vec2 p,vec2 a,vec2 b,vec2 c,float aa){
  vec2 e0=b-a,e1=c-b,e2=a-c;float side=sign(epCross(e0,c-a));
  float d=min(side*epCross(e0,p-a)/length(e0),min(side*epCross(e1,p-b)/length(e1),side*epCross(e2,p-c)/length(e2)));
  return smoothstep(-aa,aa,d);
}
vec4 epPaint(vec4 base,vec3 pigment,float mask){
  float m=clamp(mask,0.,1.),a=m+base.a*(1.-m);
  return vec4((pigment*m+base.rgb*base.a*(1.-m))/max(a,.00001),a);
}
// A lance-shaped leaf or petal: pointed at both ends, widest halfway along its length.
float epLance(vec2 p,vec2 root,vec2 tip,float width,float aa){
  vec2 d=tip-root;float len=length(d);d/=max(len,.0001);
  vec2 q=vec2(epCross(d,p-root),dot(d,p-root));
  float w=width*sin(3.14159265*clamp(q.y/len,0.,1.));
  return foliageBand(q.x,w,aa)*foliageSpan(q.y,0.,len,aa);
}
vec4 seasonalPlants(vec2 p,float h,float coast,float meadow,float alpine,float canyon){
  vec4 outp=vec4(0.);
  float floral=clamp(coast*.8+meadow+alpine*.75,0.,1.);
  if(abs(p.x)>1.5||p.y<-.16||p.y>1.35||floral+canyon<.002)return outp;
  float aa=foliageAA;
  vec3 stem=vec3(.085,.15,.035);
  // Coastal dune grass blades & golden seed plumes along the cliffside shoulder
  if(coast>.002&&h<.76){
    for(int g=0;g<4;g++){
      float gx=-.55+float(g)*.34+(h-.5)*.2;
      float arch=(float(g)-1.5)*.28;
      vec2 gFoot=vec2(gx,0.),gTip=vec2(gx+arch,.52+.18*sin(float(g)*2.+h*7.));
      outp=epPaint(outp,mix(vec3(.18,.27,.11),vec3(.44,.41,.21),float(g)/3.),epLance(p,gFoot,gTip,.022,aa)*coast);
      outp=epPaint(outp,vec3(.58,.50,.28),epLance(p,gTip-vec2(arch*.2,.1),gTip+vec2(arch*.15,.11),.032,aa)*coast);
    }
  }
  // Fallen autumn leaf scatter & lakeside cattails/reeds in Autumn Lake
  if(alpine>.002){
    for(int lf=0;lf<4;lf++){
      float lx=-.85+float(lf)*.52+sin(h*31.+float(lf)*4.)*.18;
      float ly=.02+.03*fract(h*13.+float(lf)*.37);
      vec3 lCol=lf==0?vec3(.48,.07,.03):lf==1?vec3(.56,.21,.03):vec3(.52,.36,.05);
      outp=epPaint(outp,lCol,epOval(p-vec2(lx,ly),vec2(.065,.026),aa)*alpine);
    }
    if(h<.54){
      for(int r=0;r<2;r++){
        float rx=-.35+float(r)*.46;
        vec2 rBase=vec2(rx,0.),rTop=vec2(rx+(float(r)-.5)*.08,.78+.15*h);
        outp=epPaint(outp,vec3(.14,.22,.07),epLine(p,rBase,rTop,.011,aa)*alpine);
        outp=epPaint(outp,vec3(.24,.12,.05),epLine(p,rTop-vec2(0.,.22),rTop-vec2(0.,.06),.032,aa)*alpine);
      }
    }
  }
  if(floral>.002&&h>.18){
    for(int i=0;i<3;i++){
      float v=epHash(h*81.+float(i)*7.3),x=-.72+float(i)*.61+(v-.5)*.18;
      float tall=(.38+v*.4)*(1.-alpine*.35),lean=(v-.5)*.26;
      vec2 foot=vec2(x,0.),tip=vec2(x+lean,tall);
      outp=epPaint(outp,stem,epLine(p,foot,tip,.012,aa)*floral);
      vec2 leaf=foot+(tip-foot)*.35;
      outp=epPaint(outp,stem*1.12,epLance(p,leaf,leaf+vec2(-.17,.13),.034,aa)*floral);
      leaf=foot+(tip-foot)*.57;
      outp=epPaint(outp,stem*.9,epLance(p,leaf,leaf+vec2(.15,.12),.028,aa)*floral);
      vec3 flower=v<.34?vec3(.62,.36,.055):v<.68?vec3(.42,.075,.19):vec3(.28,.09,.36);
      // Alpine patches are mostly violet and butter yellow; coastal flowers include pink thrift.
      if(alpine>.5)flower=v<.52?vec3(.31,.12,.38):vec3(.61,.39,.075);
      float size=.105+v*.035;
      for(int k=0;k<5;k++){
        float angle=float(k)*1.256637+v*3.;vec2 dir=vec2(cos(angle),sin(angle));
        outp=epPaint(outp,flower,epLance(p,tip,tip+dir*size,.038,aa)*floral);
      }
      outp=epPaint(outp,vec3(.35,.20,.035),epOval(p-tip,vec2(.025),aa)*floral);
    }
  }
  // Spiky blue-agave / yucca rosette in Red Canyon
  if(canyon>.002&&h<.52){
    vec2 agBase=vec2(.32-(h-.25)*.8,.02);
    for(int s=0;s<7;s++){
      float ang=-1.15+float(s)*.38;
      vec2 sTip=agBase+vec2(sin(ang)*.46,cos(ang)*.42);
      outp=epPaint(outp,mix(vec3(.11,.24,.18),vec3(.22,.36,.27),float(s)/6.),epLance(p,agBase,sTip,.042,aa)*canyon);
    }
  }
  // A low prickly pear complements the tall canyon saguaros; blooms are small and seasonal.
  if(canyon>.002&&h>.36&&h<.86){
    float x=-.25+(h-.5)*.7;
    float pad=epOval(p-vec2(x,.24),vec2(.15,.25),aa);
    pad=max(pad,epOval(p-vec2(x-.15,.43),vec2(.12,.19),aa));
    pad=max(pad,epOval(p-vec2(x+.17,.34),vec2(.13,.18),aa));
    outp=epPaint(outp,vec3(.12,.22,.115),pad*canyon);
    outp=epPaint(outp,vec3(.065,.115,.055),epLine(p,vec2(x,.05),vec2(x,.44),.007,aa)*canyon);
    vec2 top=vec2(x-.15,.62);
    for(int k=0;k<5;k++){
      float angle=.2+float(k)*.68;vec2 dir=vec2(cos(angle),sin(angle));
      outp=epPaint(outp,vec3(.64,.22,.075),epLance(p,top,top+dir*.085,.024,aa)*canyon);
    }
  }
  float birdWeight=coast*step(.91,h)+meadow*step(.88,h)+alpine*step(.955,h);
  if(birdWeight>.002){
    // Ground/perched bird: two fine legs, pointed tail and beak, layered wing, separate head.
    vec2 b=p-vec2(.38,.13);b.x*=h>.96?-1.:1.;
    float scale=1.+coast*.3;b/=scale;
    vec3 feather=mix(vec3(.23,.145,.085),vec3(.49,.52,.49),coast);
    feather=mix(feather,vec3(.24,.255,.24),alpine);
    outp=epPaint(outp,vec3(.18,.11,.045),max(epLine(b,vec2(-.055,.07),vec2(-.065,-.1),.011,aa),epLine(b,vec2(.035,.07),vec2(.055,-.1),.011,aa))*birdWeight);
    outp=epPaint(outp,feather*.65,epTriangle(b,vec2(-.12,.15),vec2(-.39,.26),vec2(-.19,.035),aa)*birdWeight);
    outp=epPaint(outp,feather,epOval(b-vec2(0.,.18),vec2(.21,.135),aa)*birdWeight);
    outp=epPaint(outp,feather*.64,epLance(b,vec2(.09,.22),vec2(-.21,.12),.07,aa)*birdWeight);
    outp=epPaint(outp,mix(vec3(.38,.105,.04),feather,coast+alpine),epOval(b-vec2(.12,.16),vec2(.075,.09),aa)*birdWeight);
    outp=epPaint(outp,feather*1.05,epOval(b-vec2(.17,.32),vec2(.09,.085),aa)*birdWeight);
    outp=epPaint(outp,vec3(.33,.22,.055),epTriangle(b,vec2(.235,.345),vec2(.36,.31),vec2(.23,.29),aa)*birdWeight);
    outp=epPaint(outp,vec3(.012,.016,.01),epOval(b-vec2(.20,.34),vec2(.012),aa)*birdWeight);
  }
  if(canyon>.002&&h>.91){
    // A small desert lizard on a sun-warmed rock, with tapered tail and four angular legs.
    vec2 b=p-vec2(.15,.11);b.x*=h>.96?-1.:1.;
    outp=epPaint(outp,vec3(.30,.21,.13),epOval(b-vec2(0.,-.06),vec2(.53,.18),aa)*canyon);
    vec3 skin=vec3(.29,.27,.11);
    for(int k=0;k<2;k++){
      float side=k==0?-1.:1.;
      float legs=epLine(b,vec2(-.11,.04),vec2(-.21,.04+side*.13),.015,aa);
      legs=max(legs,epLine(b,vec2(-.21,.04+side*.13),vec2(-.29,.02+side*.15),.012,aa));
      legs=max(legs,epLine(b,vec2(.13,.04),vec2(.18,.04+side*.12),.015,aa));
      legs=max(legs,epLine(b,vec2(.18,.04+side*.12),vec2(.28,.02+side*.16),.012,aa));
      outp=epPaint(outp,skin*.8,legs*canyon);
    }
    outp=epPaint(outp,skin,epTriangle(b,vec2(-.16,-.015),vec2(-.65,.10),vec2(-.15,.09),aa)*canyon);
    outp=epPaint(outp,skin,epOval(b-vec2(0.,.04),vec2(.23,.067),aa)*canyon);
    outp=epPaint(outp,skin*1.16,epTriangle(b,vec2(.17,-.015),vec2(.37,.045),vec2(.17,.11),aa)*canyon);
    outp=epPaint(outp,vec3(.11,.12,.045),epLine(b,vec2(-.17,.04),vec2(.24,.055),.012,aa)*canyon);
    outp=epPaint(outp,vec3(.012,.014,.006),epOval(b-vec2(.265,.069),vec2(.011),aa)*canyon);
  }
  return outp;
}

// Dense woodland seen on the hillsides. Each 4.8 m cell grows a small,
// overlapping rounded crown rather than stretching a color ramp over terrain.
// A footprint in surface metres integrates crown edges and fades unresolved
// crowns to their mean pigment before they can shimmer at the horizon.
vec3 autumnCanopy(vec2 p,float footprint){
  const float spacing=4.8;
  vec2 cell=floor(p/spacing);float aa=max(.025,footprint*.65);
  vec3 average=vec3(.185,.095,.031),col=vec3(.065,.061,.022);
  float detail=1.-smoothstep(1.1,4.2,footprint);
  if(detail<.001)return average;
  for(int ix=-1;ix<=1;ix++)for(int iz=-1;iz<=1;iz++){
    vec2 id=cell+vec2(float(ix),float(iz));
    float h=fract(sin(dot(id,vec2(127.1,311.7))+uSeed*3.1)*43758.54);
    float j=fract(sin(dot(id,vec2(269.5,183.3))+uSeed)*17571.31);
    vec2 center=(id+.5+vec2(h-.5,j-.5)*.46)*spacing;
    vec2 q=p-center;float radius=2.35+j*.8,r=length(q);
    float edge=radius*(1.+.055*sin(atan(q.y,q.x)*7.+h*29.)*detail);
    float cover=1.-smoothstep(edge-aa,edge+aa,r);
    if(cover<.001)continue;
    vec3 pigment=h<.24?vec3(.105,.15,.041):h<.49?vec3(.31,.058,.022):h<.78?vec3(.41,.145,.028):vec3(.38,.245,.055);
    vec2 xy=q/max(radius,.01);
    float dome=sqrt(max(0.,1.-min(.98,dot(xy,xy))));
    float light=.48+.52*max(0.,dot(normalize(vec3(xy,dome)),normalize(vec3(-.45,-.55,1.))));
    // Small, low-contrast leaf clusters soften the broad crown's interior.
    float lobes=.96+.04*sin(q.x*3.1+h*17.)*sin(q.y*2.7+j*13.)*detail;
    col=mix(col,pigment*light*lobes,cover*.96);
  }
  return mix(average,col,detail);
}

vec4 autumnTree(vec2 p,float h){
          float scale=.47+h*.3, aa=foliageAA/scale;
          vec2 q=p/scale;float crown=0.;
          for(int leaf=0;leaf<12;leaf++){
            float f=float(leaf),ang=f*2.399+h*3.;
            vec2 center=vec2(cos(ang)*(1.5+.35*sin(f*3.+h)),6.2+sin(ang)*(1.6+.35*cos(f*2.1)));
            crown=max(crown,epOval(q-center,vec2(1.12+h*.35,1.4+h*.3),aa));
          }
          float trunkA=epLine(q,vec2(0.,0.),vec2(.12,6.6),.14,aa);
          trunkA=max(trunkA,epLine(q,vec2(0.,3.7),vec2(-1.7,6.7),.08,aa));
          trunkA=max(trunkA,epLine(q,vec2(0.,4.4),vec2(1.7,7.4),.07,aa));
          trunkA=max(trunkA,epLine(q,vec2(-.45,4.8),vec2(-1.1,7.5),.045,aa));
          // Paper-birch white bark with dark lenticel bands vs dark sugar-maple bark
          float birch=step(.62,h);
          float barkBand=smoothstep(.45,.75,cos(q.y*12.+sin(q.x*6.+h*19.)))*(1.-smoothstep(.35,1.4,aa*8.));
          vec3 barkC=mix(vec3(.12,.09,.065),mix(vec3(.78,.75,.70),vec3(.16,.14,.13),barkBand*.75),birch);
          vec3 leafC=h<.44?vec3(.32,.035,.012):h<.73?vec3(.46,.12,.015):vec3(.44,.28,.025);
          leafC*=.6+.55*fbm2(q*1.1+h*21.)+.18*smoothstep(-3.,3.,q.x);
          // Visible forked upper branches peeking through the lower autumn canopy
          float peek=trunkA*smoothstep(5.4,3.2,q.y);
          return vec4(mix(leafC,barkC,clamp(1.-crown+peek*.65,0.,1.)),max(crown,trunkA));
}

const float SEA=-14.;
float mistyHeight(vec2 p,bool hi){
  float px=pathX(p.y),ry=roadY(p.y),d=abs(p.x-px);
  float t=smoothstep(4.,46.,d);
  vec2 q=p*.0088+uSeed*3.;
  q+=.55*vec2(vn(q*.73+1.3),vn(q*.73+4.1));          // bends the noise lattice out of sight
  float n=hi?fbm4(q):fbm2(q);
  float r=1.-abs(2.*fbm2(q*.63+9.)-1.);
  float m=mix(n,r*r,uRidge);
  float mid=vn(q*4.3+5.3)-.5;
  float h=ry+t*max(0.,m-.27+mid*.16)*uAmp*(1.+d*.0016);
  float far=smoothstep(110.,430.,d);
  if(far>0.){float rr=1.-abs(2.*fbm2(q*.31+2.7)-1.);h+=far*rr*rr*uAmp*1.5;}
  if(uTrees>0.)h+=smoothstep(4.,22.,d)*uTrees*pow(vn(p*.19),3.)*5.;
  if(uSea>0.){float side=smoothstep(7.,70.,p.x-px);h=mix(h,SEA-5.,side*uSea);}
  return h;
}
float mistySurface(vec2 p,bool hi){float h=mistyHeight(p,hi);return uSea>0.?max(h,SEA):h;}
float mistyMarch(vec3 ro,vec3 rd,out float last){
  float t=.8,h=0.;last=0.;
  for(int i=0;i<76;i++){
    vec3 p=ro+rd*t;h=p.y-mistySurface(p.xz,false);
    if(h<.002*t||t>680.)break;
    last=t;t+=max(h*.62,.03+t*.011);
  }
  if(t<680.&&last>0.){float a=last,b=t;for(int i=0;i<7;i++){float m=.5*(a+b);vec3 q=ro+rd*m;if(q.y-mistySurface(q.xz,false)>0.)a=m;else b=m;}t=.5*(a+b);}
  return t;
}
float mistySkyTrail=0.;
vec3 mistyNebula(vec3 rd,float s){
  vec2 p=vec2(atan(rd.x,rd.z)*1.5,rd.y*2.5-1.22);
  float wide=mix(.62,1.12,uWeather);
  float r=length(p*vec2(1.,1.22))/wide;
  float mask=smoothstep(1.3,.1,r);
  if(mask<=0.)return vec3(0.);
  vec2 q=p*2.05+vec2(uT*.011,-uT*.007);
  q+=.95*vec2(fbm2(q*.8+3.1),fbm2(q*.8+7.7))-.47;
  float d=fbm4(q*1.15);
  float wisp=pow(d,2.1)*2.1;
  float core=exp(-r*r*2.4);
  vec3 cool=mix(vec3(.25,.2,.66),vec3(.1,.44,.54),fbm2(q*.7+11.));
  vec3 warm=mix(vec3(.82,.28,.44),vec3(1.,.62,.34),core);
  vec3 c=mix(cool,warm,uWarm*(.3+.7*d));
  return c*wisp*mask*(.2+.82*uWeather)*(.62+core*.62);
}
vec3 mistySky(vec3 rd,vec2 sv){
  float y=max(rd.y,0.);
  vec3 c=mix(uSkyHz,uSkyTop,pow(y,.52));
  float s=max(dot(rd,uSunDir),0.);
  c+=uSunC*(pow(s,380.)*5.+pow(s,26.)*.42+pow(s,5.)*.2);
  // cloud deck
  if(rd.y>.004){
    vec2 cp=rd.xz/(rd.y+.13)*1.25+vec2(uT*.006,uCam.z*.0009);
    float cl=fbm4(cp);
    float cov=smoothstep(.46,.84,cl);
    vec3 cc=mix(uFog*.9,uSunC*1.02,.3+.55*pow(s,3.));
    c=mix(c,cc,cov*.62*smoothstep(.004,.13,rd.y));
  }
  if(uNebula>.002)c+=mistyNebula(rd,s)*uNebula*smoothstep(-.01,.12,rd.y);
  if(uBreathOn>.002)c+=uSunC*pow(s,mix(190.,44.,uBreath))*(.2+.62*uBreath)*uBreathOn;
  if(uHaze>.002){
    float hz=exp(-max(rd.y,0.)*mix(8.,1.7,uHaze));
    c=mix(c,uFog*.82+uSunC*pow(s,9.)*.5,uHaze*hz);
  }
  // stars at dusk, with a steady twinkle
  float dark=uDusk*smoothstep(.02,.26,rd.y);
  if(dark>.01){
    vec3 q=rd*190.;vec3 id=floor(q);vec3 f=fract(q)-.5;
    float h=fract(sin(dot(id,vec3(127.1,311.7,74.7)))*43758.5453);
    if(h>.968){float b=(h-.968)/.032;float tw=.55+.45*sin(uT*(2.+h*6.)+h*900.);
      c+=vec3(.95,.97,1.)*b*b*(tw+uSpark*1.6+uShimmer*1.1*sin(uT*18.+h*400.))*exp(-dot(f,f)*42.)*dark*2.2;}
  }
  // aurora curtains, from the inferred index in Watch
  if(uAurora>.01){
    float az=atan(rd.x,rd.z);
    float cur=pow(fbm2(vec2(az*4.+uT*.25,uT*.09)),3.)*5.;
    float band=smoothstep(.03,.2,rd.y)*smoothstep(.72,.22,rd.y);
    c+=mix(uEdge,vec3(.6,.9,1.),.45)*cur*band*uAurora*1.6;
  }
  // the horizon ridge is the last two minutes of heart rate, newest in the middle
  float u=abs(sv.x);
  float a=texture(uS,vec2(clamp(u,0.,1.),.5)).r;
  float jag=fbm2(vec2(sv.x*9.+uSeed,uT*.03))*.012;
  float top=.006+jag+a*.17;
  float edge=smoothstep(0.,.0028,top-rd.y);
  vec3 ridge=mix(uFog*.42,uSkyTop*.6,.35)+uEdge*a*.5*smoothstep(top-.05,top,rd.y);
  c=mix(c,ridge,edge*smoothstep(-.03,.0,rd.y));
  float ridgeD=abs(rd.y-top);
  c+=uEdge*exp(-pow(ridgeD/.016,1.8))*a*1.35*smoothstep(-.02,.01,rd.y);
  mistySkyTrail=exp(-pow(ridgeD/.022,1.8))*a*.4*smoothstep(-.02,.01,rd.y);
  return c;
}
vec4 mistyWorld(vec3 ro,vec3 rd,vec2 sv){
  mistySkyTrail=0.;
  vec3 skyc=mistySky(rd,sv);
  float trail=0.;
  vec3 col=skyc;
  float last;
  float t=rd.y<.32?mistyMarch(ro,rd,last):1e4;
  if(t<680.){
    vec3 p=ro+rd*t;
    bool water=uSea>0.&&p.y<=SEA+.02;
    float e=.05+t*.0018;
    vec3 N=normalize(vec3(mistySurface(p.xz-vec2(e,0.),true)-mistySurface(p.xz+vec2(e,0.),true),2.*e,mistySurface(p.xz-vec2(0.,e),true)-mistySurface(p.xz+vec2(0.,e),true)));
    float px=pathX(p.z),d=abs(p.x-px),rel=p.y-roadY(p.z);
    float dn=mix(fbm4(p.xz*.075),.5,smoothstep(50.,220.,t));
    vec3 alb=mix(uGround*.75,uGround*1.55,dn);
    float sl=1.-N.y;
    alb=mix(alb,uRock,smoothstep(.1,.42,sl+dn*.14-.07));
    if(uSnow>0.)alb=mix(alb,vec3(.84,.88,.96),uSnow*smoothstep(14.,44.,rel+dn*22.)*smoothstep(.62,.22,sl));
    if(uStrata>0.)alb*=mix(1.,.74+.3*sin(rel*.85+dn*3.5),uStrata);
    if(uGrid>0.){vec2 g=abs(fract(p.xz*.12)-.5);float gl=smoothstep(.47,.5,max(g.x,g.y));alb+=uEdge*gl*.32*uGrid*exp(-t*.012);}
    float dif=clamp(dot(N,uSunDir),0.,1.);
    vec3 amb=mix(uFog*.7,uSkyTop,.5+.5*N.y)*.62;
    vec3 c=alb*(uSunC*dif*1.5+amb);
    float back=clamp(dot(N,normalize(vec3(-uSunDir.x,0.,-uSunDir.z))),0.,1.);
    c+=alb*uSkyHz*back*.12;
    if(water){
      vec3 W=normalize(vec3((vn(p.xz*.3+uT*.5)-.5)*.14,1.,(vn(p.xz*.27-uT*.4)-.5)*.14));
      vec3 rf=reflect(rd,W);
      float keep=mistySkyTrail;c=mix(uFog*.22+uSkyTop*.18,mistySky(vec3(rf.x,abs(rf.y),rf.z),vec2(0.)),.72);mistySkyTrail=keep;
      c+=uSunC*pow(max(dot(rf,uSunDir),0.),190.)*7.;
    }
    // the road
    float aaRoad=max(.18,t/(uRes.y*uFocal));
    float rm=1.-smoothstep(uWidth-aaRoad,uWidth+aaRoad,d);
    if(!water){
      vec3 asphalt=mix(vec3(.022,.023,.03),uFog*.05,.4)+alb*.04;
      c=mix(c,asphalt*(uSunC*dif*1.2+amb),rm);
    }
    float em=0.;vec3 emC=vec3(0.);
    if(rm>0.){
      float dashL=max(uBeat*.5,1.);
      float df=fract(p.z/dashL);
      float dashAA=max(.02,t/(dashL*uRes.y*uFocal));
      float dash=smoothstep(0.,dashAA,df)*(1.-smoothstep(.5-dashAA,.5,df))*(1.-smoothstep(.05,.1,abs(p.x-px)));
      emC+=uEdge*dash*.045*rm*smoothstep(2.,16.,t);
    }
    if(uGhost.w>0.)emC+=mix(uEdge,vec3(1.),.45)*exp(-dot(p.xz-uGhost.xz,p.xz-uGhost.xz)/9.)*.75*uGhost.w;
    float aaSide=max(.02,t/(uRes.y*uFocal));
    float side=foliageBand(d-uWidth,.07,aaSide);
    float spark=pow(vn(vec2(p.z*.3,uT*1.3)),2.5)*1.8*(1.-smoothstep(35.,140.,t));
    emC+=uEdge*side*(.055+uSpark*spark*.03)*smoothstep(2.2,10.,t);
    float fog=1.-exp(-pow(t*uFogK,1.55));
    vec3 fogC=mix(uFog,uSunC,pow(max(dot(rd,uSunDir),0.),7.)*.55)*(1.-uDusk*.55);
    col=mix(c,fogC,fog)+emC*exp(-t*.0085);
    col=mix(col,skyc,smoothstep(590.,680.,t));
    trail=clamp(dot(emC,vec3(.4))*exp(-t*.0085),0.,1.);
  }
  // Layered mountain pines and mossy pass boulders along the Misty Ridges road
  if(rd.z>.02&&uTrees>.01){
    for(int row=14;row>=0;row--){
      float spacing=16.;
      float cell=floor(ro.z/spacing)+float(row)+1.;
      float z=cell*spacing,ot=(z-ro.z)/rd.z;
      if(ot>t||ot>220.||ot<.5)continue;
      vec3 hit=ro+rd*ot;
      float aa=max(.005,ot/(uRes.y*uFocal));
      for(int sideI=0;sideI<2;sideI++){
        float signX=sideI==0?-1.:1.;
        float h=fract(sin(cell*12.71+signX*91.+uSeed)*43758.54);
        float x=pathX(z)+signX*(4.4+h*11.5),dx=hit.x-x;
        if(abs(dx)>3.8)continue;
        float base=mistySurface(vec2(x,z),false),y=hit.y-base;
        if(y<-.2||y>14.)continue;
        float treeH=6.5+h*6.5,treeW=1.5+h*1.2,pine=0.;
        for(int tier=0;tier<4;tier++){
          float by=1.1+float(tier)*treeH*.16,top=by+treeH*.46;
          float rad=treeW*(1.-float(tier)*.16)*clamp((top-y)/(top-by),0.,1.);
          rad*=.88+.12*sin(y*7.+h*23.);
          pine=max(pine,foliageBand(dx,rad,aa)*foliageSpan(y,by,top,aa));
        }
        float trunk=foliageBand(dx,.14,aa)*foliageSpan(y,0.,treeH*.45,aa);
        float boulder=epOval(vec2(dx-(h-.5)*1.4,y-.35),vec2(.85+h*.4,.52+h*.25),aa)*step(.55,h);
        float sil=max(max(pine,trunk),boulder)*smoothstep(220.,140.,ot)*smoothstep(1.2,5.,ot);
        if(sil>.001){
          vec3 treeC=mix(vec3(.04,.07,.06),uGround*(.65+.35*step(0.,dx*signX)),pine);
          treeC=mix(treeC,uRock*.85,boulder);
          float fog=1.-exp(-pow(ot*uFogK,1.55));
          vec3 fogC=mix(uFog,uSunC,pow(max(dot(rd,uSunDir),0.),7.)*.55)*(1.-uDusk*.55);
          vec3 lit=treeC*(uSunC*.55+uFog*.55)*(1.-uDusk*.55);
          col=mix(col,mix(lit,fogC,clamp(fog+.18,0.,1.)),sil*.88);
        }
      }
    }
  }
  if(uGhost.w>0.){
    vec3 og=uGhost.xyz-ro;float b=dot(og,rd);
    if(b>0.&&b<t){float dg=length(og-rd*b)/(1.+b*.006);float gg=exp(-dg*dg*2.6)*uGhost.w;col+=mix(uEdge,vec3(1.),.55)*gg*2.2;trail=max(trail,gg*.8);}
  }
  // alpha marks what may leave a trail: emitters and the spectrum ridge, never the sun or the sky
  return vec4(col,max(trail,mistySkyTrail));
}

float height(vec2 p,bool hi){
  float px=pathX(p.y),ry=roadY(p.y),dx=p.x-px,d=abs(dx);
  float shoulder=smoothstep(uWidth+.35,uWidth+3.,d);
  vec2 q=p*.0088+uSeed*3.;
  float n=fbm2(q),h=0.;
  // Distinct landforms; uniform branches skip the inactive worlds on the GPU.
  if(uCoast>.001){
    float coast=ry+shoulder*(4.+n*16.)*smoothstep(2.,60.,-dx);
    coast=mix(coast,SEA-5.,smoothstep(5.,21.,dx));
    vec2 stack=vec2(dx-58.,mod(p.y+uSeed*17.,135.)-67.5);
    vec2 stack2=vec2(dx-38.,mod(p.y+uSeed*17.+52.,135.)-67.5);
    coast=max(coast,SEA-4.+26.*(1.-smoothstep(7.,15.,length(stack))));
    coast=max(coast,SEA-4.+16.*(1.-smoothstep(4.5,10.5,length(stack2))));
    h+=coast*uCoast;
  }
  if(uForest>.001)h+=(ry+shoulder*(.2+n*.9)+smoothstep(35.,150.,d)*n*6.)*uForest;
  if(uMeadow>.001)h+=(ry+shoulder*(n-.35)*5.+smoothstep(20.,180.,d)*n*14.)*uMeadow;
  if(uAlpine>.001){
    // A left-hand lake and a close right-hand bluff, with wooded hills beyond.
    float bluff=smoothstep(14.+n*4.,42.+n*9.,dx)*(24.+n*32.);
    float farHill=smoothstep(65.,160.,d)*(12.+fbm2(q*.8+3.)*28.);
    float shore=ry+shoulder*.85+bluff+farHill;
    float lake=smoothstep(5.,18.,-dx)*(1.-smoothstep(235.,285.,-dx));
    float canopy=smoothstep(6.,15.,d)*(1.-lake)*pow(vn(p*.16),2.)*2.5;
    h+=(mix(shore,SEA-7.,lake)+canopy)*uAlpine;
  }
  if(uCanyon>.001){
    float wall=smoothstep(12.+n*12.,23.+n*16.,d);
    h+=(ry+shoulder*1.2+wall*(22.+floor(n*5.)*7.))*uCanyon;
  }
  if(uTron>.001){
    float gridMesa=smoothstep(uWidth+3.,uWidth+16.,d)*(floor(n*5.)*3.5);
    float cyberPeak=smoothstep(uWidth+14.,uWidth+58.,d)*(14.+abs(2.*vn(q*2.2)-1.)*28.+floor(n*6.)*4.5);
    h+=(ry+gridMesa+cyberPeak)*uTron;
  }
  if(uMisty>.001)h+=mistyHeight(p,hi)*uMisty;
  // Land weights sum to 1-uOrbit during a space transition; preserve the
  // full shared route elevation so the temporary ground stays under the camera.
  return h+ry*(uOrbit+uSnake);
}
float surface(vec2 p,bool hi){float h=height(p,hi);return mix(h,max(h,SEA),uSea);}
float march(vec3 ro,vec3 rd,out float last){
  float t=.8,h=0.;last=0.;bool found=false;
  for(int i=0;i<140;i++){
    vec3 p=ro+rd*t;h=p.y-surface(p.xz,false);
    if(h<.002*t){found=true;break;}
    if(t>680.)break;
    last=t;t+=max(.3,t*.045);
  }
  if(!found)return 1e4;
  if(t<680.&&last>0.){float a=last,b=t;for(int i=0;i<7;i++){float m=.5*(a+b);vec3 q=ro+rd*m;if(q.y-surface(q.xz,false)>0.)a=m;else b=m;}t=.5*(a+b);}
  return t;
}
float skyTrail=0.;
vec3 sky(vec3 rd,vec2 sv){
  float y=max(rd.y,0.);
  vec3 c=mix(uSkyHz,uSkyTop,pow(y,.52));
  float s=max(dot(rd,uSunDir),0.);
  c+=uSunC*(pow(s,950.)*2.5*(1.-uTron*.55)+pow(s,56.)*.15);
  if(uTron>.001){
    // Digital Vault sky dome wireframe, I/O Tower vertical light beam, and synth-scanline solar disk
    float domeLong=foliageBand(abs(fract(atan(rd.x,rd.z)*4.45)-.5)-.5,.012,.025)*smoothstep(.04,.55,rd.y);
    float domeLat=foliageBand(abs(fract(rd.y*9.)-.5)-.5,.012,.025)*smoothstep(.04,.45,rd.y);
    c+=vec3(0.,.45,.75)*(domeLong+domeLat)*.14*uTron;
    float ioBeam=exp(-pow(sv.x/.012,2.))*smoothstep(-.02,.65,rd.y)+.32*exp(-pow(sv.x/.085,2.))*smoothstep(-.02,.38,rd.y);
    c+=mix(vec3(0.,.82,1.),vec3(.75,.96,1.),exp(-pow(sv.x/.006,2.)))*ioBeam*.75*uTron;
    float sunDisk=smoothstep(.9962,.9976,s);
    float scanline=.55+.45*smoothstep(-.2,.2,sin(rd.y*240.));
    c+=mix(vec3(1.,.36,.04),vec3(0.,.88,1.),clamp((rd.y-.04)*12.,0.,1.))*sunDisk*scanline*1.35*uTron;
  }
  // cloud deck
  if(rd.y>.004){
    vec2 cp=rd.xz/(rd.y+.13)*1.25+vec2(uT*.006,uCam.z*.0009);
    float cl=fbm4(cp);
    float cov=smoothstep(.57,.88,cl)*(1.-uTron*.85);
    vec3 cc=mix(uFog*.9,uSunC*1.02,.3+.55*pow(s,3.));
    c=mix(c,cc,cov*.62*smoothstep(.004,.13,rd.y));
  }
  if(uNebula>.002)c+=mistyNebula(rd,s)*uNebula*smoothstep(-.01,.12,rd.y);
  if(uBreathOn>.002)c+=uSunC*pow(s,mix(190.,44.,uBreath))*(.2+.62*uBreath)*uBreathOn;
  if(uHaze>.002){float hz=exp(-max(rd.y,0.)*mix(8.,1.7,uHaze));c=mix(c,uFog*.82+uSunC*pow(s,9.)*.5,uHaze*hz);}
  if(uAurora>.01){float az=atan(rd.x,rd.z);float cur=pow(fbm2(vec2(az*4.+uT*.25,uT*.09)),3.)*5.;float band=smoothstep(.03,.2,rd.y)*smoothstep(.72,.22,rd.y);c+=mix(uEdge,vec3(.6,.9,1.),.45)*cur*band*uAurora*1.6;}
  // stars at dusk
  float dark=uDusk*smoothstep(.02,.26,rd.y);
  if(dark>.01){
    vec3 q=rd*190.;vec3 id=floor(q);vec3 f=fract(q)-.5;
    float h=fract(sin(dot(id,vec3(127.1,311.7,74.7)))*43758.5453);
    if(h>.968){float b=(h-.968)/.032;float tw=.55+.45*sin(uT*(2.+h*6.)+h*900.);
      c+=vec3(.95,.97,1.)*b*b*(tw+uSpark*1.6)*exp(-dot(f,f)*42.)*dark*2.2;}
  }
  // the far range, drifting past as you ride: low in the middle, high at the edges
  float u=abs(sv.x);
  float a=texture(uS,vec2(clamp(u,0.,1.),.5)).r;
  float jag=fbm2(vec2(sv.x*9.+uSeed,uT*.03))*.012;
  float top=.006+jag+a*.17;
  float edge=smoothstep(0.,.0028,top-rd.y);
  vec3 ridge=mix(uFog*.42,uSkyTop*.6,.35)+uEdge*a*.5*smoothstep(top-.05,top,rd.y);
  c=mix(c,ridge,edge*smoothstep(-.03,.0,rd.y));
  float ridgeD=abs(rd.y-top);
  c+=uEdge*exp(-pow(ridgeD/.016,1.8))*a*1.35*smoothstep(-.02,.01,rd.y);
  skyTrail=exp(-pow(ridgeD/.022,1.8))*a*.22*smoothstep(-.02,.01,rd.y);
  return c;
}
// A sky-fixed star field and original ringed planet. No animated sparkle or
// repeating transverse track stripes: the rainbow runs along the direction of travel.
vec3 orbitSky(vec3 rd){
  vec3 c=mix(vec3(.006,.009,.032),vec3(.018,.013,.055),.5+.5*rd.y);
  vec2 cloud=vec2(rd.x*3.2+rd.z*.8,rd.y*3.4+rd.z*.3)+uSeed*.17;
  float mist=fbm4(cloud+4.2), dust=fbm2(cloud*1.8-2.);
  float band=exp(-pow((rd.y-.18-rd.x*.22)*3.2,2.));
  c+=mix(vec3(.014,.025,.07),vec3(.065,.013,.065),dust)*band*smoothstep(.26,.78,mist);
  vec2 uv=vec2(atan(rd.x,rd.z),asin(clamp(rd.y,-1.,1.)))*vec2(62.,55.);
  vec2 cell=floor(uv),f=fract(uv)-.5;
  float h=fract(sin(dot(cell,vec2(127.1,311.7))+uSeed)*43758.54);
  if(h>.92){
    float radius=.025+.055*fract(h*91.);
    float aa=max(.025,70./uRes.y);
    float star=(1.-smoothstep(radius-aa,radius+aa,length(f)))*min(1.,radius*radius/(aa*aa));
    c+=mix(vec3(.3,.46,.7),vec3(.7,.53,.3),fract(h*33.))*star*.7;
  }
  vec3 center=normalize(vec3(.64,.34,1.));
  vec3 pr=normalize(cross(vec3(0.,1.,0.),center)),pu=cross(center,pr);
  float face=dot(rd,center);
  if(face>0.){
    vec2 q=vec2(dot(rd,pr),dot(rd,pu))/face;
    vec2 r=mat2(.94,.342,-.342,.94)*q;
    float aa=2./uRes.y,rad=length(vec2(r.x,r.y/.26));
    float ring=smoothstep(.25-aa,.25+aa,rad)*(1.-smoothstep(.42-aa,.42+aa,rad));
    // Crisp Cassini-style ring division and concentric icy ringlet bands
    ring*=1.-.62*foliageBand(rad-.334,.0055,aa);
    vec3 ringC=mix(vec3(.12,.18,.28),vec3(.34,.27,.18),smoothstep(.26,.41,rad));
    ringC*=.78+.22*sin(rad*85.)+.08*cos(rad*210.);
    if(r.y>0.)c=mix(c,ringC,ring*.78);
    float disk=1.-smoothstep(.202-aa,.202+aa,length(q));
    if(disk>0.){
      vec2 p=q/.202;
      vec3 n=vec3(p,sqrt(max(0.,1.-dot(p,p))));
      float light=.22+.78*max(0.,dot(n,normalize(vec3(-.6,.7,.8))));
      float bands=.5+.5*sin(p.y*17.+sin(p.x*3.)*.8);
      vec2 storm=(p-vec2(-.22,-.18))/vec2(.19,.11);
      float eye=exp(-dot(storm,storm)*2.2);
      vec3 planet=mix(vec3(.14,.24,.31),vec3(.48,.31,.2),smoothstep(.3,.75,bands));
      planet=mix(planet,vec3(.62,.34,.22),eye*.65)*light;
      planet+=vec3(.04,.09,.15)*pow(1.-n.z,3.);
      c=mix(c,planet,disk);
    }
    if(r.y<=0.)c=mix(c,ringC,ring*.88);
  }
  vec3 moonDir=normalize(vec3(-.68,.14,1.));
  float md=length(rd-moonDir),maa=2./uRes.y;
  float moon=1.-smoothstep(.052-maa,.052+maa,md);
  if(moon>0.){
    vec2 mq=(rd.xy-moonDir.xy)/.052;
    float mare=smoothstep(.15,.55,fbm2(mq*2.8+4.));
    vec3 mCol=mix(vec3(.14,.20,.29),vec3(.09,.13,.21),mare)*(.58+.42*smoothstep(-.9,.9,mq.x));
    c=mix(c,mCol,moon);
  }
  // Gravitational lens Einstein ring from Autonomic Console's Rest mode
  if(rd.z>0.){
    vec2 lensTh=vec2(rd.x+.06,rd.y-.11);
    float lensR=length(lensTh);
    float einstein=exp(-pow((lensR-.22)/.018,2.));
    float darkCore=smoothstep(.13,.24,lensR);
    vec3 lensC=mix(vec3(.26,.56,1.),vec3(.88,.52,.96),smoothstep(.18,.26,lensR));
    c=c*darkCore+lensC*(einstein*.85+exp(-lensR*lensR*28.)*.5);
  }
  return c;
}
vec3 orbitRainbow(float x){
  float s=clamp(x,0.,.9999)*6.,i=floor(s),f=s-i;
  vec3 a,b;
  if(i<1.){a=vec3(.56,.035,.075);b=vec3(.72,.19,.025);}
  else if(i<2.){a=vec3(.72,.19,.025);b=vec3(.64,.53,.035);}
  else if(i<3.){a=vec3(.64,.53,.035);b=vec3(.035,.36,.13);}
  else if(i<4.){a=vec3(.035,.36,.13);b=vec3(.025,.36,.55);}
  else if(i<5.){a=vec3(.025,.36,.55);b=vec3(.065,.12,.58);}

// Intersect a finite ribbon, without an infinite ground plane below it. A missed

float orbitMarch(vec3 ro,vec3 rd){

vec3 orbitWorld(vec3 ro,vec3 rd){

float cloudHeight(vec2 p){

  // cover boundaries continuously; fixed world positions never boil or flicker.

  for(int ix=-1;ix<=1;ix++)for(int iz=-1;iz<=1;iz++){

    float h=fract(sin(dot(id,vec2(127.1,311.7))+uSeed)*43758.54);
    vec2 center=(id+.5+vec2(sin(h*31.),cos(h*47.))*.12)*32.;
    float radius=23.+h*6.,d2=dot(p-center,p-center);
    if(d2<radius*radius)top=max(top,-36.+sqrt(radius*radius-d2)*.8+h*2.);
  }

  const about = `
    <p class="sheet-intro">Every link from your body to the picture is a stated rule. Cadence is measured when a sensor reports it. Everything about your state is inferred.</p>
    <table class="maptable"><tbody>
      <tr><th>Cadence</th><td>Sets speed and zoom unless Brainwaves is selected in Ride. <span class="ep ep-measured">Measured</span> from a sensor only. The slider, the pedal button and the workout are labeled manual.</td></tr>

      <tr><th>Heart shift</th><td>Watch only. How far your heart rate has risen and its beat-to-beat variability fallen since your first 2 minutes, from one heart-rate sensor. A larger shift makes the gas cloud wider, brighter and warmer, charges the sky toward dusk and adds warp. <span class="ep ep-inferred">Inferred</span> It means a change in your heart signal, not a feeling.</td></tr>
      <tr><th>Brainwave balance</th><td>In Ride, with a Muse headband: your speed follows your brainwave balance, compared with 20 seconds recorded with your eyes open. It's a game rule, not a reading of your mind, attention or health. If the headband's signal is missing or poor, the ride gently stops. (The rule: a lower EEG beta/alpha ratio than in those 20 seconds scores higher. Readings: EEG at 256 Hz, the forehead light signal at 64 Hz, head motion at 52 Hz.) <span class="ep ep-proxy">Proxy</span></td></tr>

      <tr><th>Horizon</th><td>On the land scenes, the ridge on the horizon shows the last two minutes, newest in the middle. Heartbeats add a subtle brightness pulse; there are no traveling light bands across the road.</td></tr>
      <tr><th>Road</th><td>Nine scenes share the same choices as Endless Cockpit, including the original Misty ridges and Tron grid. Hills and grade are procedural and seeded. Cadence acceleration and coasting use the same motion rules in both apps. <span class="ep ep-proc">Procedural</span></td></tr>

    <p class="note">Keys: hold <b>Space</b> to pedal · <b>1-9</b> scenes · <b>R</b> / <b>B</b> next route · <b>T</b> time of day · <b>L</b> clarity · <b>Z</b> zen mode · <b>Middle click</b> random combo · <b>D</b> demo · <b>C</b> connect · <b>F</b> full screen · <b>H</b> hide controls.</p>
    <details id="is-not" open><summary>What this is, and is not</summary>
      <p><b>Not a medical device.</b> It diagnoses nothing and treats nothing, and it does not detect or predict any condition.</p>
      <p>Heart shift compares you with your own first two minutes, using one heart-rate sensor: your heart rate, and how much the time between your heartbeats varies (measured two ways, RMSSD and SDNN). Posture, breathing, caffeine and movement move it too. It is not a measure of arousal or stress, and a charged sky is not a verdict about you.</p>
      <p>Train is a paced-breathing practice game, not therapy or treatment. Clarity comes from your heart rate, not your breathing, and it isn't a score of your health: the page has no breathing sensor, so it reads how your heart rate rises and falls with the pacer.</p>
      <p>A session file is your own record of a ride, not a medical record. Pedaling raises heart rate on its own, so the index waits while you pedal.</p>
    </details>
    <details id="the-model"><summary>The model</summary>
      <p>The index is Autonomic Telemetry's own engine, <code>multivariate-1</code>, unchanged. It forms a personal reference from 120 seconds of quiet data, then scores your shift from it. 0 is your reference, and 25, 46 and 68 are its tier boundaries. These are engineering choices, not clinical cutoffs.</p>
      <p>Heart rate alone is an explicitly limited one-channel profile. If a channel in the reference goes missing, the number is withheld rather than rescaled. It has no validation against any outcome.</p>
      <p>Beat intervals outside 333 to 1500 ms, or more than 25% from the window's median, are dropped and never repaired. If more than a tenth drop, the window is rejected.</p>
      <p class="note" style="margin-bottom:0"><a href="autonomic/docs/METHODS.md">Autonomic's methods</a> · <a href="docs/BIOFEEDBACK.md" rel="noopener">This page's methods</a></p>
    </details>
    <details id="safety"><summary>Safety and privacy</summary>
      <p>Changes in brightness are smoothed. If moving light troubles you, turn on your system's reduced-motion setting: the page then calms the camera and removes the pulse.</p>
      <p>Stop if paced breathing makes you dizzy. Do not ride with your eyes on a screen outdoors.</p>
      <p>Heart rate and cadence are analyzed in this browser. Optional Muse S features arrive from your configured private relay only after you choose Find Muse S; no public service receives them. No session is saved unless you press record.</p>
    </details>
    <details id="credits"><summary>Ideas and code credited</summary>
      <p>The Hume commands follow <a href="https://github.com/brendangooden/j2208-band-tools" rel="noopener">j2208-band-tools</a> (MIT), through Autonomic's bridge. The feedback loop follows <a href="https://github.com/jberg/butterchurn" rel="noopener">Butterchurn</a> (MIT), as an idea only.</p>
    </details>
    <p class="note"><a href="field-guide.html#biofeedback">Read the field guide</a> · <a href="https://github.com/patrickiben/body-signal-labs" rel="noopener">Source</a></p>`;

        shell.toast(`New scenery · ${BIOMES[S.biomeNext].name} (Mile ${mi})`);
      }
      if (frameIdx > 2 && (!thumbAt || (!S.pedal && S.rpm < 5 && now - thumbAt > 4000 && Math.abs(S.dusk - thumbDusk) > 0.04 && !document.body.classList.contains('quiet')))) drawThumbs(now);

      // When stopped on the bike for a few seconds, or before pedaling starts,
      // the cockpit settles into Watch: the camera looks up into the sky, and the weather
      // reflects your physiological signals. When you pedal or ride, it looks ahead down the road.
      const stoppedNow = S.rpm < 5 && S.speed < 0.2 && !S.pedal && !brainRide() && !(bio.demoOn && S.demoRide);
      if (stoppedNow) {
        S.stoppedTime = (S.stoppedTime || 0) + dt;
      } else {
        S.stoppedTime = 0;
      }
      const isWatch = S.mode === 'watch' || (S.mode === 'ride' && S.stoppedTime >= 2.5 && !(bio.demoOn && S.demoRide));
      if (S.mode === 'ride' || S.mode === 'watch') bio.mode = isWatch ? 'watch' : 'ride';

      const loadT = isWatch && n.phase === 'ready' && n.idx != null ? clamp(n.idx / 100, 0, 1) : 0;
      S.load += (loadT - S.load) * (1 - Math.exp(-dt / 2.5));
      // Train: the swing at pace lifts the fog. A hold that is lost decays at half rate, and nothing here can fail.
      if (S.mode === 'train') {
        const c = bio.replayOn ? (S.replayClarity != null ? S.replayClarity : 0) : BioMath.clarity(n.swing, bio.fullSwing);
        const clean = !bio.replayOn && c != null && n.hr != null && bio.pace.on;
        if (clean) {
          const above = c >= CLARITY_TARGET;
          S.holdT = Math.max(0, S.holdT + (above ? dt : -dt * 0.5));
          S.dawn = clamp(S.dawn + dt * (above ? 1 / 45 : -1 / 90), 0, 1);
          if (S.holdT >= SET_SECONDS) S.complete = true;
          if (S.complete) { S.holdT = SET_SECONDS; S.dawn = 1; }
        }
        S.clarity += ((c || 0) - S.clarity) * (1 - Math.exp(-dt / 1.6));
      } else { S.clarity *= Math.exp(-dt / 1.6); }
      const train = S.mode === 'train', ride = S.mode === 'ride';

      // Adapt the render size to the machine. The readings never depend on this.
      if (frameMs > 120) stalled++; else stalled = 0;
      if (frameMs > 26) slow++; else if (frameMs < 20) fast++;
      frameIdx++;
      if (stalled >= 2 && lastScale > minScale) {
        lastScale = Math.max(minScale, lastScale * .5); resize(); stalled = 0; slow = 0; fast = 0;
      } else if (frameIdx % 15 === 0 && slow > 10 && lastScale > minScale) {
        lastScale = Math.max(minScale, lastScale * .75); resize(); slow = 0; fast = 0;
      } else if (frameIdx % 90 === 0) {
        if (fast > 80 && lastScale < maxScale) { lastScale = Math.min(maxScale, lastScale * 1.2); resize(); }
        slow = 0; fast = 0;
      }

      /* uniforms */
      const a = S.fromMix || currentBiome(S.biome), b = currentBiome(), t = S.biomeT * S.biomeT * (3 - 2 * S.biomeT);
      const mix3 = (k) => a.c[k].map((v, i) => lerp(v, b.c[k][i], t));
      const mixN = (k) => lerp(a[k], b[k], t);
      const blendedScene = legacyScene() ? null : sceneNow();
      const routeUniforms = blendedScene ? CyclingScene.routeUniforms(blendedScene) : {};
      const cycle = RM.matches ? 0.3 : 0.5 - 0.5 * Math.cos((now / 1000 / 240 + 0.14) * Math.PI * 2);
      const duskT = train ? lerp(0.94, 0.06, S.dawn) : isWatch ? (S.duskHold != null ? S.duskHold : 0.74) + S.load * DUSK_BIAS : (S.duskHold != null ? S.duskHold : cycle);
      if (S.duskSnap) { if (!legacyScene()) S.dusk = clamp(duskT, 0, 1); S.duskSnap = false; }   // a chosen time jumps; its look is blended below
      S.dusk += (clamp(duskT, 0, 1) - S.dusk) * Math.min(1, dtMs / 1400);
      const dusk = S.dusk, night = dusk * dusk;
      const haze = train ? (1 - S.dawn) * (1 - 0.55 * S.clarity) : 0;
      let land = legacyScene() ? null : CyclingScene.landAt(S.fromMix || currentBiome(S.biome), currentBiome(), S.biomeT, dusk);
      if (land && S.lookFrom && S.lookT < 1) {
        S.lookT = Math.min(1, S.lookT + dtMs / 1500);
        land = CyclingScene.blendLand(S.lookFrom, land, S.lookT * S.lookT * (3 - 2 * S.lookT));
      }
      if (land) S.lastLand = land;
      const duskV = land ? land.uDusk : dusk;   // the blended time value, for the stars, nebula and exposure
      const skyTop = land ? land.uSkyTop : mix3('skyTop').map((v, i) => lerp(v, [0.004, 0.006, 0.024][i], dusk * 0.94));
      const skyHz = land ? land.uSkyHz : mix3('skyHz').map((v, i) => lerp(v, [0.1, 0.045, 0.11][i], dusk * 0.92));
      const fogBase = land ? land.uFog : mix3('fog').map((v) => v * (1 - dusk * 0.86));
      const hrWarmth = n.hr ? clamp((n.hr - 120) / 50, 0, 1) : 0;
      const fogC = fogBase.map((v, i) => lerp(v, [0.42, 0.22, 0.26][i], hrWarmth * 0.16)).map((v, i) => lerp(v, [0.17, 0.2, 0.28][i], haze * 0.8));
      const sunC = land ? (train ? land.uSunC.map((v) => v * (night > 0.5 ? 0.5 : 1)) : land.uSunC) : mix3('sun').map((v, i) => lerp(v, [0.26, 0.29, 0.44][i], night * 0.96 * (train ? 0.5 : 1)));
      const groundC = land ? land.uGround : mix3('ground');
      const rockC = land ? land.uRock : mix3('rock');
      const sunEl = train ? lerp(0.015, 0.2, S.dawn) : (land ? land.uSunDir[1] : Math.max(0.035, mixN('sunEl') * (1 - dusk * 0.7)));

      // Camera on the road. When stopped in watch mode, camera tilts up to watch the sky.
      // In active ride, it looks ahead down the road. In train, it sits between.
      const tall = cv.clientHeight > cv.clientWidth;
      const targetTilt = train ? (tall ? -0.1 : 0.16) : isWatch ? (tall ? 0.3 : 0.36) : (tall ? -0.04 : 0.02);
      S.tilt += (targetTilt - S.tilt) * Math.min(1, dtMs / 1100);
      const z = S.vis, cx = pathX(z), cy = roadY(z) + 1.55 + (blendedScene ? .95 * blendedScene.snake : 0), look = 26;
      const tx = pathX(z + look), ty = roadY(z + look) + 1.0 + look * S.tilt;
      let fx = tx - cx, fy = ty - cy, fz = look;
      const fl = Math.hypot(fx, fy, fz); fx /= fl; fy /= fl; fz /= fl;
      S.motionCalm = brainRide() ? 1 - .85 * S.eegDrive : 1;
      const curveRoll = RM.matches ? 0 : S.motionCalm * clamp((pathX(z + 12) - 2 * pathX(z + 6) + cx) * (0.016 + 0.012 * (brainRide() ? S.eegDrive : motion01(S.rpm))), -0.075, 0.075);
      S.roll += (curveRoll - S.roll) * Math.min(1, dtMs / 200);
      let rx = fz, rz = -fx;
      const rl = Math.hypot(rx, rz); rx /= rl; rz /= rl;
      let ux = rz * fy, uy = rx * fz - rz * fx, uz = -rx * fy;
      if (uy < 0) { ux = -ux; uy = -uy; uz = -uz; }
      const cr = Math.cos(S.roll), sr = Math.sin(S.roll);
      const right = [rx * cr + ux * sr, uy * sr, rz * cr + uz * sr];
      const up = [ux * cr - rx * sr, uy * cr, uz * cr - rz * sr];
      const camX = cx, camY = cy + (RM.matches ? 0 : Math.sin(S.vis * 0.9) * 0.009 * (brainRide() ? S.motionCalm : motion01(S.rpm)));
      const fwd = [fx, fy, fz];
      const sunAz = train ? Math.atan2(tx - cx, look) : mixN('sunAz');
      const sd = (() => { const x = Math.sin(sunAz), z2 = Math.cos(sunAz), y = sunEl, l = Math.hypot(x, y, z2); return [x / l, y / l, z2 / l]; })();
      const speed01 = clamp(S.speed / 14, 0, 1);
      const focal = RM.matches ? 1.08 : (1.08 - speed01 * 0.04), asp = rw / rh;

      for (let i = 0; i < 12; i++) {
        const r = rings[rings.length - 1 - i], o = i * 4;
        if (r) { ringData[o] = r.z; ringData[o + 1] = (now - r.t) / 1000; ringData[o + 2] = r.v; ringData[o + 3] = r.k; } else { ringData[o + 2] = 0; }
      }
      // The horizon is the last two minutes of heart rate, newest in the middle.
      let lo = 1e9, hi = 0;
      for (let i = 0; i < 64; i++) if (bio.hist[i] > 0) { lo = Math.min(lo, bio.hist[i]); hi = Math.max(hi, bio.hist[i]); }
      const span = Math.max(14, hi - lo);
      const ease = 1 - Math.exp(-dt / 1.1);
      for (let i = 0; i < 64; i++) {
        let sum = 0, w = 0;
        for (let k = -3; k <= 3; k++) { const v = bio.hist[clamp(i + k, 0, 63)]; if (v > 0) { const kw = 4 - Math.abs(k); sum += v * kw; w += kw; } }
        ridgeF[i] += ((w ? 0.07 + ((sum / w - lo) / span) * 0.26 : 0) - ridgeF[i]) * ease;
        ridge[i] = Math.round(clamp(ridgeF[i], 0, 1) * 255);
      }
      G.bindTex(1, tRidge);
      gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 64, 1, gl.RED, gl.UNSIGNED_BYTE, ridge);

      const beatLen = Math.max(6, (n.hr ? 60 / n.hr : 0.8) * Math.max(10, S.speed));
      const m = brainRide() ? S.eegDrive : motion01(S.rpm);
      S.pulse *= Math.exp(-dt / 0.24);
      const br = bio.breath();
      const nebulaAmt = smooth(0.26, 0.72, duskV) * (ride ? (S.look !== 'clear' ? 0.42 : 0) : train ? 0.32 * (1 - S.dawn) : 1);

      /* scene */
      gl.disable(gl.BLEND);
      G.into(scene);
      G.bindTex(0, tNoise); G.bindTex(1, tRidge);
      let ghostU = [0, 0, 0, 0];
      if (S.ghost) {
        const gd = ghostDistance(now);
        S.ghostGap = gd - S.dist;
        const gz = S.vis + S.ghostGap;
        ghostU = [pathX(gz), roadY(gz) + 1.15, gz, smooth(2, 12, S.ghostGap) * (1 - smooth(350, 620, S.ghostGap))];
      }
      if (legacyScene() && !pLegacyScene) {
        pLegacyScene = G.program(PathScene.SCENE_FS);
        pLegacyMote = G.program(PathScene.MOTE_FS, PathScene.MOTE_VS);
      }
      G.use(legacyScene() ? pLegacyScene : pScene, {
        ...routeUniforms,
        uLattice: S.spaceLattice ? 1.0 : 0.0,
        uN: 0, uS: 1, uRes: [rw, rh], uT: now / 1000, uFocal: focal, uBeat: beatLen, uSeed: S.seed,
        uCam: [camX, camY, z], uRight: right, uUp: up, uFwd: fwd,
        uSkyTop: skyTop, uSkyHz: skyHz, uSunC: sunC, uGround: groundC, uRock: rockC, uFog: fogC, uEdge: mix3('edge'), uSunDir: sd,
        uAmp: mixN('amp'), uRidge: mixN('ridge'), uSea: mixN('sea'), uSnow: mixN('snow'), uStrata: mixN('strata'), uGrid: mixN('grid'), uTrees: mixN('trees'), uDusk: duskV, uFogK: mixN('fogK') * (1 + haze * 7),
        uSpark: 0.12, uShimmer: 0.1, uAurora: S.look === 'clear' ? 0 : S.load * S.load * 0.26, uTravelSpeed: S.speed,
        uRing: ringData,
        uHaze: haze, uWeather: S.load, uWarm: smooth(0.16, 0.74, S.load), uBreath: br.ee, uBreathOn: train ? 1 : 0, uNebula: nebulaAmt, uGhost: ghostU,
      });
      G.draw();

      /* motes */
      if (S.look !== 'clear') {
        gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
        G.use(legacyScene() ? pLegacyMote : pMote, { ...routeUniforms, uCam: [camX, camY, z], uRight: right, uUp: up, uFwd: fwd, uFocal: focal, uAsp: asp, uZ: z, uPx: rh * 0.09, uSeed: S.seed, uSpark: 0.12, uShimmer: 0.1, uSpeedN: m, uEdge: mix3('edge') });
        gl.drawArrays(gl.POINTS, 0, Math.round(650 + 850 * (land ? land.uMisty : 1)));
        gl.disable(gl.BLEND);
      }

      /* feedback */
      const vpP = [pathX(z + 90) - camX, roadY(z + 90) + 1 - cy, 90];
      const cz = vpP[0] * fwd[0] + vpP[1] * fwd[1] + vpP[2] * fwd[2];
      const vp = [0.5 + ((vpP[0] * right[0] + vpP[1] * right[1] + vpP[2] * right[2]) * focal) / cz / asp / 2, 0.5 + ((vpP[0] * up[0] + vpP[1] * up[1] + vpP[2] * up[2]) * focal) / cz / 2];
      const fpsScale = dtMs / 16.67;
      const zoomNow = RM.matches ? S.zoom * 0.4 : 1 - Math.pow(1 - (S.zoom + (brainRide() || S.look === 'clear' ? 0 : 0.0012)), fpsScale);
      const wildEff = brainRide() ? (S.eegValid ? (S.wild || 0.35) * S.motionCalm : 0) : (S.look === 'clear' ? 0 : (train ? S.wild * (1 - S.clarity) : clamp(S.wild + S.load * AROUSAL_WILD, 0, 1)));
      S.effectiveWild = wildEff;
      G.into(dreamB);
      G.bindTex(0, scene.tex); G.bindTex(1, dreamA.tex);
      G.use(pDream, { uScene: 0, uPrev: 1, uVP: vp, uZoom: zoomNow, uDream: brainRide() ? (RM.matches ? (S.dream || 0.55) * 0.5 : (S.dream || 0.55)) * (1 - .7 * S.eegDrive) : (S.look === 'clear' ? 0 : ((RM.matches ? S.dream * 0.5 : S.dream) * (brainRide() ? 1 - .7 * S.eegDrive : 1))), uWild: wildEff, uT: now / 1000 });
      G.draw();
      const tmp = dreamA; dreamA = dreamB; dreamB = tmp;

      /* bloom and grade */
      const bloom = Post.bloom(dreamA.tex, 1.15);
      Post.finish(dreamA.tex, bloom, {
        uBloomK: S.look === 'clear' ? 0.22 : (0.22 + S.dream * 0.16 + S.load * 0.14),
        uExposure: 0.98 + duskV * 0.25,
        uFlash: 0, uFlashC: [1, 0.93, 0.82], uGrain: 0.022, uT: now / 1000,
        uVig: S.look === 'clear' ? 0.25 : (0.25 + S.load * 0.15),
        uSat: S.look === 'clear' ? 1.02 : (1.02 + wildEff * 0.22), rate: RM.matches ? 0.16 : 0.36, maxGain: 1,
      }, dt);

      /* the dotted orbit, over the finished picture */
      const scale = Math.min(1, asp * 1.15);
      let sunNdc = [0, 0];
      { const d = sd[0] * fwd[0] + sd[1] * fwd[1] + sd[2] * fwd[2]; if (d > 0.05) sunNdc = [((sd[0] * right[0] + sd[1] * right[1] + sd[2] * right[2]) * focal) / d / asp, ((sd[0] * up[0] + sd[1] * up[1] + sd[2] * up[2]) * focal) / d]; }
      const cT = train ? [sunNdc[0], sunNdc[1]] : [0, asp < 1 ? 0.3 : 0.27];
      S.orbitC = S.orbitC.map((v, i) => lerp(v, cT[i], Math.min(1, dtMs / 500)));
      const aT = (ride && !isWatch) ? 0 : train ? 0.95 : (bio.demoOn || bio.replayOn || bio.hr.connected ? 0.85 : 0.42);
      S.orbitA += (aT - S.orbitA) * Math.min(1, dtMs / 500);
      if (S.orbitA > 0.01) {
        const R = train ? lerp(0.2, 0.37, br.ee) * scale : 0.6 * scale;
        G.into(null);
        gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
        G.use(pOrbit, { uC: S.orbitC, uR: R, uAsp: asp, uT: now / 1000, uA: S.orbitA, uPx: Math.max(1.5, (cv.height / 900) * 2.1), uSquash: train ? 1 : 0.8 });
        gl.drawArrays(gl.POINTS, 0, train ? 620 : 900);
        gl.disable(gl.BLEND);
      }
      // The cue sits inside the breathing ring, wherever the sun has drifted to.
      if (train) {
        const bx = (S.orbitC[0] * 0.5 + 0.5) * cv.clientWidth;
        const sb = $('scenebar'), dw = document.querySelector('.dock-wrap');
        const minY = (sb ? sb.getBoundingClientRect().bottom : 80) + 32;
        const maxY = (dw ? dw.getBoundingClientRect().top : cv.clientHeight - 160) - 48;
        const rawY = (0.5 - S.orbitC[1] * 0.5) * cv.clientHeight;
        const by = maxY > minY ? clamp(rawY, minY, maxY) : rawY;
        $('breath').style.transform = `translate(${bx.toFixed(1)}px, ${by.toFixed(1)}px)`;
        $('breath').classList.toggle('on-light', S.dawn > 0.42);
      }

      if (lumaRec) lumaRec(now);
      if (wantSnap) { const done = wantSnap; wantSnap = null; cv.toBlob((blob) => done(blob), 'image/png'); }
    } catch (e) {
      if (fails++ < 3) console.error(e);
    }
  }

  /* ---- boot ---- */
  shell.setMode(S.mode);
  renderReading(); renderHud();
  if (!G) {
    shell.glFail('This page draws with WebGL2, which this browser did not provide. The sensors below still report their state.');
    const idle = (now) => { requestAnimationFrame(idle); bio.tick(now); if (now - lastText > 120) { lastText = now; renderStates(); renderReading(); renderHud(); if ($('signal-sheet').open) { renderSignal(); drawSignal(); } } };
    requestAnimationFrame(idle);
  } else {
    gl = G.gl;
    try {
      Post = createPost(G);
      pScene = G.program(SCENE_FS);
      pDream = G.program(DREAM_FS);
      pMote = G.program(MOTE_FS, MOTE_VS);
      pOrbit = G.program(ORBIT_FS, ORBIT_VS);
      tNoise = G.noiseTexture(20261102);
      tRidge = G.tex(64, 1, { internal: gl.R8, format: gl.RED, type: gl.UNSIGNED_BYTE });
      resize();
      addEventListener('resize', resize);
      cv.addEventListener('webglcontextlost', (e) => { e.preventDefault(); shell.glFail('The graphics context was lost. Reload the page to get the picture back.'); });
      requestAnimationFrame(render);
    } catch (e) {
      console.error(e);
      shell.glFail(`The picture could not start on this graphics card: ${String(e.message).slice(0, 140)}`);
    }
  }

  // For the flicker check: the picture's brightness on a small grid, every frame, straight after it is drawn.
  let lumaRec = null;
  function recordLuma(ms) {
    const c = document.createElement('canvas'); c.width = 64; c.height = 36;
    const g = c.getContext('2d', { willReadFrequently: true }), frames = [], t0 = performance.now();
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    return new Promise((res) => {
      lumaRec = (now) => {
        g.drawImage(cv, 0, 0, 64, 36);
        const d = g.getImageData(0, 0, 64, 36).data, grid = [];
        for (let i = 0; i < d.length; i += 4) grid.push(+(0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]).toFixed(1));
        frames.push({ t: +(now - t0).toFixed(1), grid });
        if (now - t0 > ms) { lumaRec = null; res(frames); }
      };
    });
  }

  /* for the checks: read what is really on the canvas and in the engine */
  window.__app = {
    S, bio, eeg, setDrivePower, BioMath, BIOMES, pathX, roadY, gradeAt, gradeFactor, motion01, CLARITY_TARGET, recordLuma,
    setBiome, chooseBiome, nextBiome, setTod, setLook, setAuto, drawThumbs, sceneNow, step, sessionStart, startReplay, restoreStart,
    get renderInfo() { return { softwareRenderer, width: rw, height: rh, pixelBudget: sceneBudget * lastScale }; },
    pixel() {
      const c = document.createElement('canvas'); c.width = 32; c.height = 18;
      const g = c.getContext('2d');
      return new Promise((res) => { wantSnap = (blob) => { const im = new Image(); im.onload = () => { g.drawImage(im, 0, 0, 32, 18); const d = g.getImageData(0, 0, 32, 18).data; let sum = 0, min = 1e9, max = 0; const grid = []; for (let i = 0; i < d.length; i += 4) { const l = d[i] * 0.2126 + d[i + 1] * 0.7152 + d[i + 2] * 0.0722; sum += l; min = Math.min(min, l); max = Math.max(max, l); grid.push(l); } res({ mean: sum / (d.length / 4), min, max, grid }); }; im.src = URL.createObjectURL(blob); }; });
    },
  };
})();

</script>
</body>
