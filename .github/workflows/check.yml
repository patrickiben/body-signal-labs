name: Browser checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Built pages match src
        run: |
          python3 build.py
          git diff --exit-code -- endless-cockpit.html biofeedback-path-cockpit.html index.html field-guide.html Body_Signal_Labs_Offline.html offline.html
      - name: Sensor freshness and session integrity
        run: |
          node tests/session_regressions.cjs
          node tests/autonomic_math_qc.cjs
          node tests/autonomic_varx_qc.cjs
          node tests/autonomic_device_rate_qc.cjs
          node tests/autonomic_regime_qc.cjs
          node tests/autonomic_regime_stretch_qc.cjs
          node tests/autonomic_regime_momentum_qc.cjs
          node tests/autonomic_switching_ar_qc.cjs
          node tests/autonomic_fast_stretch_qc.cjs
          node tests/autonomic_cadence_effort_qc.cjs
          python3 autonomic/scripts/embed-guide-math.py --check
          node tests/eeg_drive.cjs
          node tests/cadence_motion.cjs
          node tests/midi_drive.cjs
          python3 tests/site_links.py
          node tests/bsl-math.test.mjs
      - name: Optional Muse bridge HTTP contract
        env:
          AUTONOMIC_ROOT: ${{ github.workspace }}/autonomic
        run: python3 -m unittest discover -s tests -p test_brainwave_bridge.py
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 tests/smoke.py
      - run: python3 tests/workbench_ride.py
      - run: python3 tests/midi_ride.py
      - run: python3 tests/bsl_math_test.py
